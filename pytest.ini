; 单元测试配置（tests/unit/）。
;
;   pip install -r requirements-dev.txt
;   python -X utf8 -m pytest              # 全量
;   python -X utf8 -m pytest tests/unit/test_assessment_report.py -v
;
; Windows 上务必带 `-X utf8`：断言信息里全是中文，默认 locale 编码（cp936）在管道里
; 会把它们输成乱码。conftest.py 里也做了一层 reconfigure，但 pytest 的 TerminalWriter
; 在 conftest 之前就抓好了原始流，兜不全，所以命令行这一下是权威做法。
;
; testpaths 只指向 tests/unit：现有 tests/*.py 与 scripts/*.py 是「自起服务的 e2e 脚本」，
; 不是 pytest 用例，被 collect 到就会去起 uvicorn / 连库。
;
; pytest 不进 backend/requirements.txt —— 那是 backend 独立部署的镜像清单，
; 只能有运行时依赖（见 CLAUDE.md「第一原则」）。测试依赖在 requirements-dev.txt。
[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q -ra --strict-markers --import-mode=importlib
markers =
    known_bug: 已发现但未修的 backend 缺陷。用例断言的是**修好之后**该有的行为，
        配 xfail(strict=True)：现在 XFAIL，修好后变 XPASS 让套件变红，
        提醒把标记删掉、转成常规回归测试。见 tests/unit/test_known_bugs.py
filterwarnings =
    ignore::DeprecationWarning
