<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CN 五维知识来源目录</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #fff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #1d4ed8;
      --soft: #eff6ff;
      --ok: #059669;
      --warn: #d97706;
      --edge: #7c3aed;
      --shadow: 0 8px 24px rgba(15, 23, 42, .06);
      --r: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(800px 280px at 0% 0%, #dbeafe 0%, transparent 55%),
        radial-gradient(700px 240px at 100% 0%, #ede9fe 0%, transparent 50%),
        var(--bg);
      min-height: 100vh;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; }
    header {
      display: flex; flex-wrap: wrap; gap: 12px;
      justify-content: space-between; align-items: flex-start;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .nav a {
      display: inline-block; margin-left: 8px; font-size: 13px;
      color: var(--primary); text-decoration: none; font-weight: 600;
    }
    .nav a:hover { text-decoration: underline; }
    .meta-bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 16px; font-size: 12px; color: var(--muted);
    }
    .pill {
      background: #fff; border: 1px solid var(--line); border-radius: 999px;
      padding: 4px 10px;
    }
    .pill strong { color: var(--text); }
    .toc {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
    }
    .toc a {
      text-decoration: none; color: var(--text); font-size: 13px; font-weight: 600;
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 12px; box-shadow: var(--shadow);
    }
    .toc a:hover { border-color: #93c5fd; background: var(--soft); }
    .toc a.edge { border-color: #ddd6fe; }
    .toc a.edge:hover { background: #f5f3ff; }
    section.block {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
      box-shadow: var(--shadow); padding: 16px 18px 8px; margin-bottom: 16px;
    }
    section.block h2 {
      margin: 0 0 4px; font-size: 17px; display: flex; flex-wrap: wrap;
      align-items: baseline; gap: 8px 12px;
    }
    section.block h2 .count {
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: #f8fafc; border: 1px solid var(--line); border-radius: 999px;
      padding: 2px 8px;
    }
    .sec-note { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
    .src {
      border-top: 1px solid var(--line); padding: 12px 0;
    }
    .src:first-of-type { border-top: 0; }
    .src-head {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 6px;
    }
    .src-head h3 { margin: 0; font-size: 14px; font-weight: 700; flex: 1 1 200px; }
    .badge {
      font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px;
      border: 1px solid transparent;
    }
    .b-in_use { background: #ecfdf5; color: var(--ok); border-color: #a7f3d0; }
    .b-planned { background: #fffbeb; color: var(--warn); border-color: #fde68a; }
    .b-hitl { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
    .b-official { background: #eff6ff; color: var(--primary); border-color: #bfdbfe; }
    .b-ai_inferred { background: #f5f3ff; color: var(--edge); border-color: #ddd6fe; }
    .b-derived { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
    .grid {
      display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px;
      font-size: 12.5px; line-height: 1.5;
    }
    .grid .k { color: var(--muted); }
    .grid a { color: var(--primary); word-break: break-all; }
    .grid code {
      font-size: 11.5px; background: #f8fafc; border: 1px solid var(--line);
      border-radius: 4px; padding: 1px 5px; word-break: break-all;
    }
    .policy {
      background: #fff; border: 1px dashed #cbd5e1; border-radius: var(--r);
      padding: 14px 16px; margin-bottom: 16px; font-size: 13px;
    }
    .policy h2 { margin: 0 0 8px; font-size: 14px; }
    .policy ul { margin: 0; padding-left: 18px; color: var(--muted); }
    .policy li { margin: 4px 0; }
    .err {
      background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
      padding: 12px 14px; border-radius: 10px; font-size: 13px;
    }
    footer {
      margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>CN 五维知识来源目录</h1>
        <p class="sub">专业 / 岗位 / 技能 / 课程 / 认证 与各类边的<strong>知识从哪来</strong>。<br />
          数据文件：<code>schemas/cn_knowledge_sources.json</code> · 新增来源请同步改此文件</p>
      </div>
      <div class="nav">
        <a href="/admin-cytoscape">图谱后台</a>
        <a href="/docs" target="_blank">API</a>
      </div>
    </header>

    <div class="meta-bar" id="metaBar">
      <span class="pill">加载中…</span>
    </div>

    <div class="policy" id="policyBox" hidden>
      <h2>收录与维护原则</h2>
      <ul id="policyList"></ul>
    </div>

    <nav class="toc" id="toc" aria-label="目录"></nav>
    <div id="main"></div>
    <footer id="foot"></footer>
  </div>

  <script>
    const STATUS_LABEL = {
      in_use: "使用中",
      planned: "计划中",
      hitl: "需人工",
      deprecated: "已停用",
      mostly_done: "基本完成",
    };
    const CONF_LABEL = {
      official: "官方",
      derived: "派生",
      ai_inferred: "AI/规则",
      manual_seed: "人工种子",
    };

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function badgeStatus(st) {
      const cls = st === "in_use" || st === "mostly_done" ? "b-in_use"
        : st === "hitl" ? "b-hitl" : "b-planned";
      return `<span class="badge ${cls}">${esc(STATUS_LABEL[st] || st || "—")}</span>`;
    }
    function badgeConf(c) {
      if (!c) return "";
      const cls = c === "official" ? "b-official" : c === "ai_inferred" ? "b-ai_inferred" : "b-derived";
      return `<span class="badge ${cls}">${esc(CONF_LABEL[c] || c)}</span>`;
    }

    function renderSource(s, i) {
      const urls = (s.urls || []).filter(Boolean);
      const urlHtml = urls.length
        ? urls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("<br/>")
        : "—";
      return `<article class="src">
        <div class="src-head">
          <h3>${i}. ${esc(s.title || s.id)}</h3>
          ${badgeStatus(s.status)}
          ${badgeConf(s.confidence)}
        </div>
        <div class="grid">
          <div class="k">发布方</div><div>${esc(s.publisher || "—")}</div>
          <div class="k">主页/链接</div><div>${s.home ? `<a href="${esc(s.home)}" target="_blank" rel="noopener">${esc(s.home)}</a>` : "—"}
            ${urls.length ? `<div style="margin-top:4px">${urlHtml}</div>` : ""}</div>
          <div class="k">本地路径</div><div><code>${esc(s.local_path || "—")}</code></div>
          <div class="k">入库脚本</div><div><code>${esc(s.pipeline || "—")}</code></div>
          <div class="k">source_system</div><div><code>${esc(s.source_system || "—")}</code></div>
          <div class="k">获取方式</div><div>${esc(s.method || "—")}</div>
          <div class="k">许可/声明</div><div>${esc(s.license || "—")}</div>
          <div class="k">备注</div><div>${esc(s.notes || "—")}</div>
        </div>
      </article>`;
    }

    function renderDim(d, idx) {
      const sources = d.sources || [];
      return `<section class="block" id="dim-${esc(d.id)}">
        <h2>${idx}. ${esc(d.zh || d.name)}
          <span class="count">节点约 ${esc(d.approx_count ?? "—")} · type=${esc(d.node_type || d.id)}</span>
        </h2>
        <p class="sec-note">知识来源 [${sources.map((_, i) => i + 1).join(" · ")}] 共 ${sources.length} 项</p>
        ${sources.map((s, i) => renderSource(s, i + 1)).join("") || "<p class='sec-note'>暂无登记</p>"}
      </section>`;
    }

    function renderEdge(e, idx) {
      const sources = e.sources || [];
      return `<section class="block" id="edge-${esc(e.id)}">
        <h2>边 ${idx}. ${esc(e.zh || e.name)}
          <span class="count">边约 ${esc(e.approx_count ?? "—")} · ${esc(e.rel_type || e.id)}</span>
        </h2>
        <p class="sec-note">${esc(e.coverage_note || "")} · 知识来源 [${sources.map((_, i) => i + 1).join(" · ")}]</p>
        ${sources.map((s, i) => renderSource(s, i + 1)).join("") || "<p class='sec-note'>暂无登记</p>"}
      </section>`;
    }

    async function main() {
      const mainEl = document.getElementById("main");
      const toc = document.getElementById("toc");
      try {
        const r = await fetch("/schemas/cn_knowledge_sources.json?_=" + Date.now());
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();

        document.getElementById("metaBar").innerHTML = `
          <span class="pill">更新 <strong>${esc(data.updated || "—")}</strong></span>
          <span class="pill">地区 <strong>${esc(data.region || "CN")}</strong></span>
          <span class="pill">数据文件 <strong>${esc(data.maintenance?.data_file || "schemas/cn_knowledge_sources.json")}</strong></span>
        `;

        if (data.policy) {
          document.getElementById("policyBox").hidden = false;
          const ul = document.getElementById("policyList");
          const rules = data.policy.rules || [];
          ul.innerHTML = rules.map((x) => `<li>${esc(x)}</li>`).join("")
            + (data.policy.related_docs || []).map((d) => `<li>相关文档：<code>${esc(d)}</code></li>`).join("");
        }

        const dims = data.dimensions || [];
        const edges = data.edges || [];
        toc.innerHTML =
          dims.map((d, i) => `<a href="#dim-${esc(d.id)}">${i + 1}. ${esc(d.zh || d.name)}</a>`).join("")
          + edges.map((e, i) => `<a class="edge" href="#edge-${esc(e.id)}">边${i + 1}. ${esc(e.zh || e.name)}</a>`).join("");

        mainEl.innerHTML =
          dims.map((d, i) => renderDim(d, i + 1)).join("")
          + `<h2 style="font-size:16px;margin:20px 0 10px;color:#64748b">关系边的知识来源</h2>`
          + edges.map((e, i) => renderEdge(e, i + 1)).join("");

        const how = (data.maintenance?.how_to_add_source || []).map((x) => `<li>${esc(x)}</li>`).join("");
        document.getElementById("foot").innerHTML =
          `新增来源请编辑 JSON 后刷新本页。${how ? `<div style="text-align:left;max-width:640px;margin:12px auto 0"><ol style="padding-left:18px">${how}</ol></div>` : ""}`;
      } catch (e) {
        mainEl.innerHTML = `<div class="err">加载失败：${esc(e.message)}。请确认服务已启动且存在 schemas/cn_knowledge_sources.json</div>`;
      }
    }
    main();
  </script>
</body>
</html>
