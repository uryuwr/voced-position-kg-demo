<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI 能力测评 · 职业教育知识图谱</title>
<style>
  body{margin:0;background:#0b1220;color:#e6edf7;
       font:14px/1.6 "Microsoft YaHei",system-ui,-apple-system,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 18px 60px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .top h1{font-size:17px;margin:0}
  .top a{color:#8fa3c0;font-size:13px;text-decoration:none}
  .top a:hover{color:#34d399}
  select{background:#111a2b;color:#e6edf7;border:1px solid #1e2b45;border-radius:8px;padding:7px 10px;font:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>AI 能力测评</h1>
    <div>
      <span style="color:#8fa3c0;font-size:13px">目标岗位</span>
      <select id="occSel"><option value="">（用我锁定的目标）</option></select>
      <a href="/student?tab=path">← 回学员端</a>
    </div>
  </div>
  <div id="box"></div>
</div>

<script src="/js/api-client.js"></script>
<script src="/js/assessment-widget.js"></script>
<script>
/* 独立页只是组件的一层薄壳：步骤条、出题、判分、报告全在 assessment-widget.js，
   与 student.html 的「③ AI 诊断」tab 共用同一份实现。 */
(async function () {
  const api = window.VocedApi;
  try { await api.initAuth(); } catch (e) {
    document.getElementById("box").textContent = "鉴权初始化失败：" + (e.message || e);
    return;
  }

  let picked = "";
  const sel = document.getElementById("occSel");
  try {
    const [d, goal] = await Promise.all([
      api.apiFetch("/v1/student/positions?page=1&page_size=50"),
      api.apiFetch("/v1/student/goal").catch(() => null),
    ]);
    picked = (goal && goal.occupation_id) || "";
    sel.innerHTML = `<option value="">（用我锁定的目标${goal ? "：" + goal.occupation_name : ""}）</option>`
      + (d.items || []).map((x) =>
        `<option value="${x.id}" ${x.id === picked ? "" : ""}>${x.name}</option>`).join("");
  } catch (_) { /* 取不到列表也不挡测评，后端会回落到活跃目标 */ }
  sel.onchange = () => { picked = sel.value; };

  const inst = window.AssessmentWidget.mount(document.getElementById("box"), {
    getOccupationId: () => picked || null,
    onGotoPath: () => { location.href = "/student?tab=path"; },
  });

  // 刷新恢复：/assessment?session=123
  const sid = new URLSearchParams(location.search).get("session");
  if (sid) inst.resume(sid);
})();
</script>
</body>
</html>
