<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学员端 · 岗位探索与自适应提升（E2E 演示）</title>
  <script src="/js/api-client.js"></script>
  <script src="/js/assessment-widget.js"></script>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
            --primary:#6366f1; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-size:14px;
           font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    header { padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
    header h1 { margin:0 0 3px; font-size:18px; }
    header .sub { color:var(--muted); font-size:12px; }
    .tabs { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
    .tabs button { background:#0b1220; color:var(--muted); border:1px solid var(--line);
                   border-radius:8px; padding:7px 14px; cursor:pointer; font-size:13px; }
    .tabs button.on { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:600; }
    main { padding:16px 20px 40px; }
    .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    input, select { background:#0b1220; color:var(--text); border:1px solid var(--line);
                    border-radius:8px; padding:8px 11px; font-size:13px; }
    input { min-width:220px; }
    button.act { background:var(--primary); color:#fff; border:0; border-radius:8px;
                 padding:8px 14px; cursor:pointer; font-size:13px; }
    button.ghost { background:transparent; color:var(--text); border:1px solid var(--line);
                   border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
    .card h3 { margin:0 0 6px; font-size:15px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .tag { font-size:11px; border-radius:999px; padding:2px 9px; background:#0b1220;
           border:1px solid var(--line); color:var(--muted); }
    .tag.lv { color:#a5b4fc; border-color:#4f46e5; }
    .tag.core { color:#fca5a5; border-color:#b91c1c; }
    .score { font-size:19px; font-weight:700; color:var(--ok); }
    /* 无分数时的占位：与真实分数同字号同位置，用虚线框+灰字表达「待测」，
       不能退化成一句普通文字，否则看不出这里本来有匹配度 */
    .score.unknown { color:var(--muted); border:1px dashed var(--line);
                     border-radius:8px; padding:1px 10px; font-weight:600; }
    .score.unknown .q { color:var(--warn); }
    .match-cta { background:transparent; color:var(--warn); border:1px solid var(--warn);
                 border-radius:8px; padding:4px 10px; cursor:pointer; font-size:12px; }
    .muted { color:var(--muted); font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:500; font-size:12px; }
    .bar-wrap { background:#0b1220; border-radius:6px; height:8px; overflow:hidden; min-width:110px; }
    .bar-in { height:100%; background:var(--ok); }
    .stage { border-left:3px solid var(--primary); padding-left:12px; margin-bottom:16px; }
    .step { display:flex; gap:10px; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line); }
    .step.done .t { text-decoration:line-through; color:var(--muted); }
    .step .t { flex:1; }
    textarea { width:100%; min-height:130px; background:#0b1220; color:var(--text);
               border:1px solid var(--line); border-radius:8px; padding:10px; font-size:13px; }
    .drop { border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center;
            color:var(--muted); cursor:pointer; }
    .drop.over { border-color:var(--primary); color:var(--text); }
    .toast { position:fixed; left:50%; top:14px; transform:translateX(-50%); background:#000;
             border:1px solid var(--line); padding:9px 16px; border-radius:8px; z-index:99; display:none; }
    .empty { color:var(--muted); padding:26px; text-align:center; }
    pre { background:#0b1220; border:1px solid var(--line); border-radius:8px; padding:10px;
          font-size:11px; overflow:auto; max-height:240px; }
    /* 岗位卡片上的「成长通道 / 核心胜任力」两块（跟随深色主题，别用浅底） */
    .growth { margin-top:8px; padding:8px 10px; border:1px solid var(--line);
              border-radius:8px; background:#0b1220; }
    .growth b { color:var(--text); font-size:12px; }
    .tag.sk { color:#86efac; border-color:#166534; }
  </style>
</head>
<body>
  <header>
    <h1>岗位探索与自适应提升中心</h1>
    <div class="sub">E2E 演示页：覆盖 岗位探索 / 岗位详情 / AI 诊断 / 自适应学习路径 四个模块（不还原视觉，重在打通功能）</div>
    <div class="bar" style="margin-top:10px">
      <span class="muted">当前锁定目标：</span><b id="goalName">未锁定</b>
      <span id="goalMatch" class="score"></span>
      <button class="ghost" id="btnClearGoal">清除目标</button>
      <span class="muted" id="who"></span>
    </div>
    <div class="tabs">
      <button data-tab="explore" class="on">① 岗位探索</button>
      <button data-tab="detail">② 岗位详情</button>
      <button data-tab="profile">② ' 我的画像</button>
      <button data-tab="diag">③ AI 诊断</button>
      <button data-tab="path">④ 岗位学习与自适应路径</button>
    </div>
  </header>
  <main>
    <section id="tab-explore">
      <div class="bar">
        <input id="q" placeholder="搜索岗位名称，如 混凝土工 / 数据" />
        <button class="act" id="btnSearch">搜索</button>
        <span class="muted" id="exploreMeta"></span>
      </div>
      <div class="grid" id="posGrid"><div class="empty">点「搜索」加载岗位</div></div>
    </section>

    <section id="tab-detail" hidden>
      <div class="bar"><span class="muted">从「岗位探索」点卡片进入，或先搜索再选一个岗位</span></div>
      <div id="detailBox"><div class="empty">尚未选择岗位</div></div>
    </section>

    <!-- 我的画像：匹配度用到的三份数据（实测/记忆/合并）+ 五维记忆原始响应 -->
    <section id="tab-profile" hidden>
      <div class="bar">
        <button class="act" id="btnProfReload">刷新画像</button>
        <button class="ghost" id="btnProfParse">重新解析为技能画像（调模型，5–10s）</button>
        <span class="muted" id="profMeta"></span>
      </div>
      <div id="profBox"><div class="empty">加载中…</div></div>
    </section>

    <!-- AI 诊断：步骤引导式测评工作流。三个节点的状态与输出全部读服务端 graph
         返回的 stages，组件实现见 js/assessment-widget.js（与 /assessment 页共用） -->
    <section id="tab-diag" hidden>
      <div id="awBox"><div class="empty">加载中…</div></div>
    </section>

    <section id="tab-path" hidden>
      <!-- 顶部卡片：当前锁定目标 / 岗位晋升路径 / 测评结果，三者都按岗位绑定 -->
      <div id="goalCard"><div class="empty">加载中…</div></div>
      <!-- 胜任力能力报告与技能缺口分析 -->
      <div id="compBox"></div>
      <!-- 自适应学习计划：服务端编排后推送到学习空间，本页只触发与回显 -->
      <div id="planBox"></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
    const S = { positions: [], current: null, goal: null, session: null };

    function toast(m) { const t=$("toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none", 2800); }
    // UC MAC 签名基于完整 URL，同 URL 重复请求会被判重放 → 加自增序号
    let _n = 0;
    const api = (u, o) => window.VocedApi.apiFetch(u + (u.includes("?") ? "&" : "?") + "_n=" + (++_n), o || {});

    document.querySelectorAll(".tabs button").forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
        ["explore","detail","profile","diag","path"].forEach((t) => { $("tab-" + t).hidden = t !== b.dataset.tab; });
        if (b.dataset.tab === "profile") loadProfile();
        if (b.dataset.tab === "path") loadPath();
        if (b.dataset.tab === "diag") loadDiag();
      };
    });

    /* ── ① 岗位探索 ─────────────────────────────── */
    async function search() {
      const q = $("q").value.trim();
      $("posGrid").innerHTML = '<div class="empty">加载中…</div>';
      try {
        const d = await api("/v1/student/positions?page_size=12" + (q ? "&q=" + encodeURIComponent(q) : ""));
        S.positions = d.items || [];
        $("exploreMeta").textContent = `共检索到 ${d.total ?? S.positions.length} 个岗位`;
        renderPositions();
      } catch (e) { $("posGrid").innerHTML = `<div class="empty">失败：${esc(e.message || e)}</div>`; }
    }
    // 成长通道 / 核心胜任力都由**列表接口一次带回**（progressions / top_skills）。
    // 以前是一张卡两个请求：/positions/{id} 拿技能 + /positions/progressions 拿通道，
    // 一页 12 张卡 = 25 个请求。服务端侧换成了两条批量 SQL，与页大小无关。
    function renderGrowth(p) {
      const gs = p.progressions || [];
      if (!gs.length) return "";
      return `<div class="growth">
        <div class="muted" style="margin-bottom:4px">📈 成长通道（${gs.length} 条路径）</div>
        ${gs.map((g) => `<div class="row" style="gap:6px">
          <span class="tag">${esc(g.direction)}</span>
          <b>${esc((g.target || {}).name || "—")}</b>
        </div>`).join("")}
      </div>`;
    }

    function renderTopSkills(p) {
      const ss = p.top_skills || [];
      if (!ss.length) return "";
      return `<div class="growth">
        <div class="muted" style="margin-bottom:4px">核心胜任力要求：</div>
        <div class="row" style="gap:6px;flex-wrap:wrap">
          ${ss.map((s) => `<span class="tag sk">${esc(s.skill_name || s.skill_key)}${
            s.required_level ? ` <b>L${s.required_level}</b>` : ""}</span>`).join("")}
        </div>
      </div>`;
    }

    function renderPositions() {
      if (!S.positions.length) { $("posGrid").innerHTML = '<div class="empty">无结果</div>'; return; }
      $("posGrid").innerHTML = S.positions.map((p, i) => `
        <div class="card">
          <div class="row">
            ${p.industry_name ? `<span class="tag">${esc(p.industry_name)}</span>` : ""}
            ${p.level ? `<span class="tag lv">L${p.level}</span>` : ""}
            ${p.salary ? `<span class="tag">${esc(p.salary)}</span>` : `<span class="tag muted">薪资待补</span>`}
            <span style="flex:1"></span>
          </div>
          <h3>${esc(p.name)}</h3>
          <div class="muted">${esc((p.desc || "").slice(0, 60))}</div>
          ${renderGrowth(p)}
          ${renderTopSkills(p)}
          <div class="row" style="margin-top:10px">
            <button class="ghost" data-detail="${i}">岗位详情</button>
            <button class="ghost" data-lock="${i}">${S.goal && S.goal.occupation_id === p.id ? "已锁定" : "锁定目标"}</button>
            <button class="act" data-diag="${i}">AI 智能诊断</button>
          </div>
        </div>`).join("");
      $("posGrid").querySelectorAll("[data-detail]").forEach((el) => el.onclick = () => openDetail(S.positions[+el.dataset.detail]));
      $("posGrid").querySelectorAll("[data-lock]").forEach((el) => el.onclick = () => lockGoal(S.positions[+el.dataset.lock]));
      $("posGrid").querySelectorAll("[data-diag]").forEach((el) => el.onclick = () => {
        lockGoal(S.positions[+el.dataset.diag]).then(() => document.querySelector('[data-tab="diag"]').click());
      });
      // 列表不再展示匹配度：整页逐行算会触发模型、拖慢首屏；改到详情页按需算
    }
    /** 匹配度只在岗位详情按需取：服务端级联（诊断报告 > 实测画像 > 记忆推断），
        只有最后一档才会调模型，所以放在详情里等几秒可以接受，放列表里逐行算不行。 */
    // 措辞要能区分「测过这个岗位」和「用你已有的技能画像去比对这个岗位」——
    // biz_user_skill 是跨岗位累积的，写成「已测技能」会被读成「测过本岗位」。
    // 取值表与服务端 `PositionMatchOut.source` 一一对应，少一个就会掉成空文案：
    // 分数旁边空着，学员不知道这个数可不可信。
    const MATCH_SOURCE_LABEL = {
      diagnosis: "实测 · 你诊断过这个岗位",
      assessment: "推算 · 用你在其他岗位测出的技能比对",
      memory: "预估 · 由你的能力画像推断",
      // 有分数但只能当参考：岗位大部分要求没配能力要求档，分母只剩一小块
      partial_baseline: "参考 · 该岗位的能力要求仅部分配置",
      no_overlap: "该岗位要求的技能你还没测过",
      // 没有分数，且原因不在学员身上：岗位一项要求档都没配（库内 80% 的岗位目前如此）
      no_baseline: "该岗位的能力标准待完善，暂时无法评分",
      none: "尚无评估依据",
    };
    /** 报告/总览里的匹配度文案。`AssessmentReportOut.match_score` 已改成**可空**，
        直接拼字符串会渲染出「匹配度 null%」，兜底成 0% 又会被读成「完全不匹配」。
        所以 null 一律换成按 `score_status` 分支的说明文案（与服务端同一套口径）。 */
    const SCORE_STATUS_NOTE = {
      no_skills: "该岗位技能构成待完善，暂时无法评分",
      no_baseline: MATCH_SOURCE_LABEL.no_baseline,   // 同一件事只写一处文案
      no_weight: "该岗位技能权重待完善，暂时无法评分",
      no_evidence: "本次未测到任何技能，暂未评估",
    };
    function matchScoreText(score, status) {
      if (score == null) return SCORE_STATUS_NOTE[status] || "未测评";
      return `匹配度 ${score}%` + (status === "partial_baseline" ? "（仅供参考）" : "");
    }
    /** 哪些来源**不该**给「做一次 AI 诊断」的引导。
        no_baseline 缺的是运营配置而不是学员证据：诊断做完照样算不出匹配度，
        引导学员去做一件注定无效的操作比不给引导更糟。 */
    const NO_DIAG_CTA = new Set(["no_baseline"]);
    async function loadMatchInto(pid, box) {
      box.innerHTML = '<span class="muted">匹配度计算中…</span>';
      try {
        const d = await api("/v1/student/positions/match?position_id=" + encodeURIComponent(pid));
        const label = MATCH_SOURCE_LABEL[d.source] || "";
        if (d.match_score == null) {
          // 占位也要长得像分数：同一位置、同一字号，虚线框 + 问号
          // （**不能退化成 0%**：0% 会被读成「完全不匹配」，这里是「没有评分依据」）
          box.innerHTML = `<span class="score unknown"><span class="q">?</span> %</span>
            <span class="muted">${esc(label)}</span>
            <span class="muted">${esc(d.reason || "")}</span>
            ${NO_DIAG_CTA.has(d.source)
              ? '<span class="tag" style="color:#f59e0b;border-color:#b45309">等岗位标准补齐后自动可算</span>'
              : '<button class="match-cta" data-go-diag>做一次 AI 诊断 →</button>'}`;
          const b = box.querySelector("[data-go-diag]");
          if (b) b.onclick = () => {
            const p = S.current;
            if (p) lockGoal(p).then(() => document.querySelector('[data-tab="diag"]').click());
          };
          return d;
        }
        // 分数照显示，但 partial_baseline 必须把「仅供参考 + 缺了多少」摆在旁边：
        // 只有 18% 的权重配了要求档时，那个 50% 不是「匹配一半」
        const partial = d.source === "partial_baseline";
        box.innerHTML = `<span class="score">${d.match_score}%</span>
          <span class="muted">${esc(label)}${d.estimated ? "（预估）" : ""}</span>
          ${partial ? `<span class="tag" style="color:#f59e0b;border-color:#b45309">仅供参考${
            d.no_baseline_weight != null ? ` · ${d.no_baseline_weight}% 的能力要求待完善` : ""
          }</span>` : ""}
          ${(d.gaps || []).length ? `<span class="muted">· 主要缺口：${
            (d.gaps || []).slice(0, 3).map((g) => esc(g.skill_key)).join("、")}</span>` : ""}`;
        return d;
      } catch (e) {
        box.innerHTML = `<span class="muted">匹配度获取失败：${esc(e.message || e)}</span>`;
      }
    }

    /* ── 目标锁定 ─────────────────────────────── */
    /** 让用户选一条晋升链路再锁定。
     *
     * 只有一条（或没有）时不打扰用户，直接锁 —— 弹一个只有一个选项的框没有意义。
     * 不传 progression_path 时后端会自动绑第一条，所以取消选择也不会没有链路。
     */
    async function pickProgression(occId) {
      let paths = [];
      try {
        const r = await api(`/v1/student/positions/progressions?id=${encodeURIComponent(occId)}`);
        paths = r.paths || [];
      } catch (e) { return null; }        // 拿不到链路不该挡住锁定
      if (paths.length < 2) return null;
      const lines = paths.map((p, i) => {
        const names = [p.hops[0].from.name, ...p.hops.map((h) => h.to.name)];
        return `${i + 1}. ${names.join(" → ")}（${p.direction || "方向未分类"}）`;
      });
      const ans = prompt(
        `该岗位有 ${paths.length} 条晋升方向，选一条绑定（回车=第 1 条）：\n\n` + lines.join("\n"),
        "1");
      if (ans === null) return null;
      const idx = Math.max(1, Math.min(paths.length, parseInt(ans, 10) || 1)) - 1;
      const p = paths[idx];
      // 序列必须从目标岗位本身开始，服务端会校验这一点
      return [p.hops[0].from.id, ...p.hops.map((h) => h.to.id)];
    }

    async function lockGoal(p) {
      if (!p) return;
      try {
        const path = await pickProgression(p.id);
        const body = { occupation_id: p.id };
        if (path) body.progression_path = path;
        await api("/v1/student/goal", { method: "PUT", body });
        await loadGoal(); renderPositions();
        toast("已锁定：" + p.name + (path ? `（晋升链路 ${path.length - 1} 跳）` : ""));
      } catch (e) { toast("锁定失败：" + (e.message || e)); }
    }
    async function loadGoal() {
      try {
        const g = await api("/v1/student/goal");
        S.goal = g && g.occupation_id ? g : null;
        $("goalName").textContent = S.goal ? (S.goal.occupation_name || S.goal.occupation_id) : "未锁定";
        $("goalMatch").textContent = "";
        if (S.goal) {
          // 与「岗位学习与自适应路径」列表同源：都取该岗位最近一次测评的匹配度。
          // 此前这里用 positions/match（拿累积技能画像算全量技能），同一岗位会出现
          // 两个不同的数字（顶部 53% / 列表 28%）——画像只升不降，历史高分会一直留着。
          const ov = await api("/v1/student/goal/overview?occupation_id="
            + encodeURIComponent(S.goal.occupation_id));
          if (ov && ov.match_score != null) {
            $("goalMatch").textContent = ov.match_score + "% 匹配";
            $("goalMatch").title = "来自最近一次 AI 测评";
          } else {
            // 尚未测评：退回按已有画像的预估值，并明确标注，避免与实测值混淆
            const m = await api("/v1/student/positions/match?position_id="
              + encodeURIComponent(S.goal.occupation_id));
            const label = MATCH_SOURCE_LABEL[m.source] || "尚无评估依据";
            if (m.match_score == null) {
              // 原来这里写 `m.match_score ?? 0`，把「算不出来」渲染成 0% ——
              // 学员读成「完全不匹配」。没有依据就摆占位，别编一个数字
              $("goalMatch").innerHTML = `<span class="score unknown"><span class="q">?</span> %</span>
                <span class="muted">${esc(label)}</span>`;
              $("goalMatch").title = m.reason || label;
            } else {
              $("goalMatch").innerHTML = `${m.match_score}% <span class="muted">${
                m.source === "partial_baseline" ? "仅供参考（岗位标准待完善）" : "预估（未测评）"}</span>`;
              $("goalMatch").title = m.source === "partial_baseline"
                ? (m.reason || "该岗位大部分能力要求尚未配置，分数仅供参考")
                : "尚无该岗位的测评记录，按已有技能画像预估";
            }
          }
        }
      } catch (e) { S.goal = null; $("goalName").textContent = "未锁定"; }
    }
    $("btnClearGoal").onclick = async () => {
      try { await api("/v1/student/goal", { method: "DELETE" }); await loadGoal(); renderPositions(); toast("已清除目标"); }
      catch (e) { toast("失败：" + (e.message || e)); }
    };

    /* ── ② 岗位详情 ─────────────────────────────── */
    async function openDetail(p) {
      if (!p) return;
      S.current = p;
      document.querySelector('[data-tab="detail"]').click();
      $("detailBox").innerHTML = '<div class="empty">加载中…</div>';
      try {
        // 技能构成先渲染，匹配度异步填：级联到「记忆推断」那档要调模型，
        // 不该让整个详情页陪着等
        const comp = await api("/v1/student/positions/skill-composition?id=" + encodeURIComponent(p.id));
        const skills = comp.skills || [];
        let match = null;
        $("detailBox").innerHTML = `
          <div class="card">
            <div class="row">
              <h3 style="margin:0">${esc(p.name)}</h3>
              ${p.level ? `<span class="tag lv">L${p.level}</span>` : ""}
              <span style="flex:1"></span>
            </div>
            <div class="row" id="matchBox" style="margin-top:6px"></div>
            <div class="muted" style="margin-top:6px">${esc(p.desc || "（岗位职责描述待补充）")}</div>
            <h3 style="margin-top:14px">岗位必备胜任力图谱</h3>
            <table>
              <tr><th>技能名称</th><th>要求等级</th><th>权重</th><th>类别</th><th>我的等级</th></tr>
              ${skills.map((s) => {
                const mi = match && (match.items || []).find((x) => x.skill_key === s.skill_key);
                return `<tr>
                  <td>${esc(s.skill_name || s.name || s.skill_key)} ${s.is_core ? '<span class="tag core">核心</span>' : ""}</td>
                  <td>L${s.required_level ?? "-"}</td>
                  <td>${s.weight_pct != null ? s.weight_pct + "%" : "-"}</td>
                  <td class="muted">${esc(s.category_name || s.category || "待归类")}</td>
                  <td class="my-lv" data-sk="${esc(s.skill_key || s.name)}">–</td>
                </tr>`;
              }).join("")}
            </table>
            <div class="muted" style="margin-top:8px">技能 ${comp.skill_count ?? skills.length} 项 · 权重合计 ${comp.weight_sum ?? "-"}</div>
            <div class="row" style="margin-top:12px">
              <button class="ghost" id="dLock">锁定目标</button>
              <button class="act" id="dDiag">AI 智能诊断</button>
            </div>
          </div>
          <div class="card" id="progBox"><div class="empty">晋升链路加载中…</div></div>
          <div class="card" id="courseBox"><div class="empty">课程资源加载中…</div></div>`;
        $("dLock").onclick = () => lockGoal(p);
        $("dDiag").onclick = () => lockGoal(p).then(() => document.querySelector('[data-tab="diag"]').click());
        // 晋升链路与课程都走独立接口异步填：岗位详情/技能构成接口都不含它们，
        // 加卡片不动既有契约
        loadProgressionsInto(p.id, $("progBox"));
        loadCoursesInto(p.id, $("courseBox"));
        // 匹配度与「我的等级」列一起异步回填
        match = await loadMatchInto(p.id, $("matchBox"));
        if (match) {
          const byKey = {};
          (match.items || []).forEach((x) => { byKey[x.skill_key] = x; });
          document.querySelectorAll("#detailBox .my-lv").forEach((td) => {
            const mi = byKey[td.dataset.sk];
            td.textContent = mi && mi.user_level ? "L" + mi.user_level : "—";
          });
        }
      } catch (e) { $("detailBox").innerHTML = `<div class="empty">失败：${esc(e.message || e)}</div>`; }
    }

    /* ── ②' 岗位晋升链路 ────────────────────────────
       独立接口 GET /v1/student/positions/progressions，不改岗位详情契约。
       advances_to 是 1:N —— 一个岗位有多个向上方向（本方向纵深 / 管理路线 /
       跨方向转型），每条路径一个 tab。早期本体误定 1:1、读路径 LIMIT 1，
       Java 有三条向上路径却只显示「全栈工程师」一条。 */
    const DIR_COLOR = {
      "本方向纵深": "#10b981", "技术纵深": "#10b981",
      "管理路线":   "#a78bfa",
      "跨方向转型": "#f59e0b", "向上发展": "#60a5fa",
    };
    async function loadProgressionsInto(pid, box) {
      try {
        const d = await api("/v1/student/positions/progressions?id=" + encodeURIComponent(pid));
        const paths = d.paths || [];
        if (!paths.length) {
          box.innerHTML = '<h3 style="margin:0 0 6px">岗位晋升链路</h3>'
            + '<div class="empty">该岗位暂未配置晋升关系（advances_to 覆盖约 5%），补齐后此处显示各个向上方向</div>';
          return;
        }
        const tabId = (i) => "progPath" + i;
        box.innerHTML = `
          <h3 style="margin:0 0 6px">岗位晋升链路</h3>
          <div class="muted" style="margin-bottom:8px">
            ${paths.length} 条向上路径${d.truncated ? "（已截断）" : ""} ·
            由 AI 依据岗位职级与技能构成推断，点 tab 切换
          </div>
          <div class="row" id="progTabs" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">
            ${paths.map((p, i) => `
              <button class="ghost prog-tab" data-i="${i}"
                style="border-color:${DIR_COLOR[p.direction] || "#60a5fa"}">
                ${esc(p.target.name || "")}${p.depth > 1 ? ` · ${p.depth}步` : ""}
              </button>`).join("")}
          </div>
          ${paths.map((p, i) => `
            <div id="${tabId(i)}" class="prog-panel" style="display:${i ? "none" : "block"}">
              <div class="row" style="gap:6px;margin-bottom:8px">
                <span class="tag" style="color:${DIR_COLOR[p.direction] || "#60a5fa"};border-color:${DIR_COLOR[p.direction] || "#60a5fa"}">${esc(p.direction)}</span>
                <span class="muted" style="font-size:12px">
                  ${esc(p.hops[0].from.name || "")}${p.hops.map((h) => ` → ${esc(h.to.name || "")}`).join("")}
                </span>
              </div>
              ${p.hops.map((h, j) => `
                <div style="margin-bottom:10px;padding-left:10px;border-left:2px solid ${DIR_COLOR[h.direction] || "#334155"}">
                  <div class="row" style="gap:6px">
                    <b>第${j + 1}步：${esc(h.to.name || "")}</b>
                    ${h.to.level ? `<span class="tag lv">L${h.to.level}</span>` : ""}
                    ${h.to.level_name ? `<span class="tag">${esc(h.to.level_name)}</span>` : ""}
                  </div>
                  ${h.evidence ? `<div class="muted" style="font-size:12px;margin-top:4px">${esc(h.evidence)}</div>` : ""}
                  <div class="muted" style="font-size:12px;margin-top:6px">进阶要补的技能：</div>
                  <div style="margin-top:4px">
                    ${(h.unlock_skills || []).length
                      ? h.unlock_skills.map((s) => `<span class="tag">${esc(s.skill_name || s.skill_key)}${
                          s.required_level ? " L" + s.required_level : ""}${
                          s.current_required_level ? "（现 L" + s.current_required_level + "）" : "（新增）"}</span>`).join(" ")
                      : '<span class="muted">目标岗位暂未配置技能构成</span>'}
                  </div>
                </div>`).join("")}
            </div>`).join("")}`;
        box.querySelectorAll(".prog-tab").forEach((b) => {
          b.onclick = () => {
            box.querySelectorAll(".prog-panel").forEach((el, k) => {
              el.style.display = String(k) === b.dataset.i ? "block" : "none";
            });
            box.querySelectorAll(".prog-tab").forEach((x) => x.classList.remove("act"));
            b.classList.add("act");
          };
        });
        const first = box.querySelector(".prog-tab");
        if (first) first.classList.add("act");
      } catch (e) {
        box.innerHTML = '<h3 style="margin:0 0 6px">岗位晋升链路</h3>'
          + `<div class="empty">加载失败：${esc(e.message || e)}</div>`;
      }
    }

    /* ── ②'' 岗位相关课程 ───────────────────────────
       独立接口 GET /v1/student/positions/courses，不改岗位详情契约。
       real（平台真实课程）与 landing（检索入口）必须分开显示：
       混在一起报「N 门课程」会让「点开是搜索页」冒充「有课可学」。 */
    async function loadCoursesInto(pid, box) {
      try {
        const d = await api("/v1/student/positions/courses?id=" + encodeURIComponent(pid));
        const groups = d.by_skill || [];
        if (!groups.length) {
          box.innerHTML = '<h3 style="margin:0 0 6px">岗位相关课程</h3>'
            + '<div class="empty">该岗位技能暂无关联课程资源</div>';
          return;
        }
        // 四类资源必须视觉可分：只有 real 点开当场能学。
        // enroll 曾经也标「真课」，学员点进去是报名墙，还有一批往期课程已结课。
        const BADGE = {
          real:    { text: "可直接学", color: "#10b981", border: "#047857" },
          enroll:  { text: "需报名",   color: "#a78bfa", border: "#6d28d9" },
          catalog: { text: "课标目录", color: "#60a5fa", border: "#1d4ed8" },
          landing: { text: "检索页",   color: "#f59e0b", border: "#b45309" },
        };
        const badge = (c) => {
          const b = BADGE[c.kind] || BADGE.landing;
          return `<span class="tag" style="color:${b.color};border-color:${b.border}">${b.text}</span>`;
        };
        box.innerHTML = `
          <h3 style="margin:0 0 6px">岗位相关课程</h3>
          <div class="muted" style="margin-bottom:8px">
            <b style="color:#10b981">可直接学 ${d.real_course_count}</b>${
              d.enroll_count ? ` · <span style="color:#a78bfa">需报名 ${d.enroll_count}</span>` : ""
            } ·
            检索入口 ${d.landing_count} · 覆盖 ${d.skill_count} 个技能${
              d.catalog_hidden
                ? ` · <span style="color:#6b7280">另有 ${d.catalog_count} 条课标目录未显示（链接指向专业教学标准目录页，非课程）</span>`
                : ""
            }
          </div>
          ${groups.map((g) => `
            <div style="margin-bottom:10px">
              <div class="row" style="gap:6px">
                <b>${esc(g.skill_key)}</b>
                <span class="tag lv">L${g.required_level ?? "-"}</span>
                <span class="muted">权重 ${g.weight != null ? (g.weight * 100).toFixed(0) + "%" : "-"}</span>
              </div>
              <div style="margin-left:10px;margin-top:4px">
                ${(g.courses || []).map((c) => `
                  <div class="row" style="gap:6px;margin-top:2px">
                    ${badge(c)}
                    ${c.url
                      ? `<a href="${esc(c.url)}" target="_blank" rel="noreferrer noopener">${esc(c.name)}</a>`
                      : esc(c.name)}
                    <span class="muted">${c.platform_label ? esc(c.platform_label) : ""}${
                      c.learner_count ? " · " + c.learner_count.toLocaleString() + " 人学过" : ""
                    }${c.school ? " · " + esc(c.school) : ""}</span>
                  </div>`).join("")}
              </div>
            </div>`).join("")}
          <div class="muted" style="margin-top:6px">${esc(d.note || "")}</div>`;
      } catch (e) {
        box.innerHTML = '<h3 style="margin:0 0 6px">岗位相关课程</h3>'
          + `<div class="empty">失败：${esc(e.message || e)}</div>`;
      }
    }

    /* ── ②' 我的画像：五维记忆 + 技能画像 + 诊断记录 ─────────
       默认只调画像服务（1–2s）不调模型；技能画像那块只读缓存，
       要重新解析得显式点按钮。                                    */
    const FACET_STYLE = {
      identity:   { icon: "✍", color: "#3b82f6" },
      context:    { icon: "💬", color: "#8b5cf6" },
      preference: { icon: "❤", color: "#ec4899" },
      experience: { icon: "💡", color: "#f59e0b" },
      activity:   { icon: "🔧", color: "#10b981" },
    };

    async function loadProfile(opts) {
      opts = opts || {};
      $("profBox").innerHTML = '<div class="empty">加载中…</div>';
      $("profMeta").textContent = opts.parse ? "正在调模型重新解析…" : "正在拉取五维记忆…";
      try {
        const d = await api("/v1/student/profile" + (opts.parse ? "&parse=1" : ""));
        const mem = d.memory || {}, sk = d.skills || {};
        $("profMeta").textContent =
          `记忆 ${mem.total ?? 0} 条 · 实测技能 ${(sk.counts || {}).assessment ?? 0} 项`
          + (sk.parsed ? ` · 记忆推断 ${(sk.counts || {}).memory ?? 0} 项` : " · 技能画像未解析");

        const facetCards = (mem.facets || []).map((f) => {
          const st = FACET_STYLE[f.facet] || { icon: "•", color: "#64748b" };
          const detail = (f.items || []).map((it) => `
            <div style="border-left:2px solid ${st.color};padding-left:10px;margin:8px 0 8px 46px">
              <div>${esc(it.title || it.summary || "(无标题)")}
                ${it.subtype ? `<span class="tag">${esc(it.subtype)}</span>` : ""}</div>
              ${it.summary && it.summary !== it.title ? `<div class="muted">${esc(it.summary)}</div>` : ""}
              ${it.details ? `<div class="muted">${esc(String(it.details).slice(0, 160))}</div>` : ""}
              ${(it.tags || []).length ? `<div style="margin-top:4px">${
                it.tags.slice(0, 8).map((t) => `<span class="tag">${esc(t)}</span>`).join(" ")}</div>` : ""}
              ${Object.keys(it.facet_details || {}).length
                ? `<details style="margin-top:4px"><summary class="muted">facetDetails</summary>
                     <pre>${esc(JSON.stringify(it.facet_details, null, 2))}</pre></details>` : ""}
              <div class="muted" style="font-size:11px">${esc((it.captured_at || "").slice(0, 19).replace("T", " "))}
                · ${esc(it.memory_id || "")}</div>
            </div>`).join("");
          return `
            <div style="padding:10px 0;border-bottom:1px solid var(--line)">
              <div class="row">
                <span style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
                             background:${st.color}22;color:${st.color};font-size:16px">${st.icon}</span>
                <div style="flex:1">
                  <b>${esc(f.label)}</b>
                  <span class="muted">${f.count ? `（${f.count} 条）` : ""}</span>
                  <div class="muted">${esc(f.digest)}</div>
                </div>
              </div>
              ${detail}
            </div>`;
        }).join("");

        const skillRows = (list, emptyText) => list.length
          ? `<table><tr><th>技能</th><th>档位</th><th>来源</th></tr>${list.map((x) => `
              <tr><td>${esc(x.skill_name || x.skill_key)}</td><td>L${x.level}</td>
                  <td class="muted">${esc(x.from || x.source || "-")}</td></tr>`).join("")}</table>`
          : `<div class="muted">${emptyText}</div>`;

        $("profBox").innerHTML = `
          <div class="card" style="margin-bottom:12px">
            <div class="row"><h3 style="margin:0">🧠 AI 记忆画像</h3>
              <span class="tag">${mem.available ? "服务已接通" : "服务未配置"}</span></div>
            <div class="muted" style="margin:6px 0 10px">
              基于您在平台的学习足迹，为个人 AI 助手构筑的五大分层记忆特征，
              用于自适应构建更贴合、更有针对性的个人专属画像。</div>
            ${mem.error ? `<div class="muted" style="color:var(--warn)">${esc(mem.error)}</div>` : ""}
            ${facetCards || '<div class="muted">暂无记忆数据</div>'}
            <div class="muted" style="margin-top:10px;font-size:11px">
              ${esc(mem.endpoint || "")}${esc(mem.path || "")}</div>
          </div>

          <div class="card" style="margin-bottom:12px">
            <h3>服务端原始返回值</h3>
            <div class="muted">请求</div>
            <pre>${esc(JSON.stringify(mem.request || {}, null, 2))}</pre>
            <div class="muted">响应（原始 groups 结构）</div>
            <pre>${esc(JSON.stringify(mem.raw || {}, null, 2))}</pre>
          </div>

          <div class="card" style="margin-bottom:12px">
            <h3>实测技能画像 <span class="muted">biz_user_skill · 跨岗位累积</span></h3>
            ${skillRows(d.assessment || [], "尚无实测技能，先做一次 AI 诊断")}
          </div>

          <div class="card" style="margin-bottom:12px">
            <h3>参与匹配度计算的合并画像
              <span class="muted">${sk.parsed ? "实测覆盖记忆推断" : "（记忆尚未解析为技能）"}</span></h3>
            ${skillRows(sk.merged || [], "暂无")}
          </div>

          <div class="card">
            <h3>各岗位诊断记录 <span class="muted">匹配度级联的第一优先级</span></h3>
            ${(d.diagnoses || []).length
              ? `<table><tr><th>岗位</th><th>匹配度</th><th>渠道</th><th>时间</th></tr>${
                  d.diagnoses.map((x) => `<tr><td>${esc(x.occupation_name || x.occupation_id)}</td>
                    <td>${x.match_score != null ? x.match_score + "%" : "—"}</td>
                    <td class="muted">${esc(x.channel || "")}</td>
                    <td class="muted">${esc((x.created_at || "").slice(0, 16).replace("T", " "))}</td></tr>`).join("")}</table>`
              : '<div class="muted">尚无诊断记录</div>'}
          </div>`;
      } catch (e) {
        $("profBox").innerHTML = `<div class="empty">失败：${esc(e.message || e)}</div>`;
        $("profMeta").textContent = "";
      }
    }
    $("btnProfReload").onclick = () => loadProfile();
    $("btnProfParse").onclick = () => loadProfile({ parse: true });

    /* ── ③ AI 诊断：步骤引导式测评工作流 ─────────────
       三节点的状态与输出全部由服务端 graph 的 stages 驱动，前端不自己推断进度。
       组件与 /assessment 独立页共用一份实现。                        */
    let awInst = null;
    function loadDiag() {
      if (awInst) return;                       // 已挂载则保留现场，不重置进度
      awInst = window.AssessmentWidget.mount($("awBox"), {
        getOccupationId: () => (S.goal || {}).occupation_id || null,
        occupationName: (S.goal || {}).occupation_name || null,
        onReport: () => { loadGoal(); },        // 报告出来后刷新顶部目标条的匹配度
        onGotoPath: () => document.querySelector('[data-tab="path"]').click(),
      });
    }

    /* ── ④ 岗位学习与自适应路径 ───────────────────────
       顶部卡片三块数据都来自 GET /v1/student/goal/overview，按岗位绑定：
       换目标即换整套（目标 / 晋升路径 / 该岗位的测评结果）。          */
    /* 两级视图：先列出诊断过/锁定过的岗位，点进去才看该岗位的详情卡片。
       每个岗位一套独立数据（目标 / 晋升 / 测评结果），列表是它们的入口。 */
    let pathPage = 1;
    async function loadPath(occId, page) {
      if (occId) return loadPathDetail(occId);
      if (page) pathPage = page;
      $("compBox").innerHTML = ""; $("planBox").innerHTML = "";
      $("goalCard").innerHTML = '<div class="empty">加载中…</div>';
      try {
        const d = await api(`/v1/student/goal/diagnosed?page=${pathPage}&page_size=12`);
        const list = d.items || [];
        if (!list.length && pathPage > 1) { return loadPath(null, 1); }
        if (!list.length) {
          $("goalCard").innerHTML = `<div class="empty">还没有诊断记录。
            先到「岗位探索」锁定一个目标岗位，再做一次 AI 诊断</div>`;
          return;
        }
        $("goalCard").innerHTML = `
          <div class="bar"><b>我的岗位诊断</b>
            <span class="muted">共 ${d.total} 个岗位 · 第 ${d.page}/${d.pages || 1} 页 · 点卡片查看该岗位的能力报告与学习路径</span></div>
          <div class="grid">
            ${list.map((x) => `
              <div class="card" style="cursor:pointer" data-occ="${esc(x.occupation_id)}">
                <div class="row" style="justify-content:space-between">
                  <b>${esc(x.occupation_name || "未命名岗位")}</b>
                  ${x.is_active_goal ? '<span class="tag" style="color:#34d399;border-color:#10b981">当前活跃目标</span>' : ""}
                </div>
                <div class="row" style="margin-top:4px">
                  ${x.level_label ? `<span class="tag lv">${esc(x.level_label)}</span>` : ""}
                  ${x.major_name ? `<span class="tag">${esc(x.major_name)}</span>` : ""}
                  ${x.goal_status === "archived" ? '<span class="tag">历史目标</span>' : ""}
                </div>
                <div class="muted" style="margin-top:6px;min-height:32px">
                  ${esc((x.description || "暂无岗位职责描述").slice(0, 52))}</div>
                <div class="row" style="justify-content:space-between;margin-top:8px">
                  <span>${x.match_score != null
                    ? `<span class="score">${x.match_score}%</span> <span class="muted">匹配度</span>`
                    /* 不能写「尚未测评」：测过但岗位没配能力要求档时这里同样是 null，
                       那是数据缺口不是学员没测 */
                    : '<span class="muted">暂无匹配度</span>'}</span>
                  <span class="muted">${x.diagnosed_at
                    ? "诊断于 " + fmtTime(x.diagnosed_at) + (x.session_count > 1 ? ` · ${x.session_count} 次` : "")
                    : (x.goal_created_at ? "锁定于 " + fmtTime(x.goal_created_at) : "")}</span>
                </div>
              </div>`).join("")}
          </div>`;
        if ((d.pages || 1) > 1) {
          const nav = document.createElement("div");
          nav.className = "bar";
          nav.style.marginTop = "12px";
          nav.innerHTML = `
            <button class="ghost" ${d.page <= 1 ? "disabled" : ""} data-prev>← 上一页</button>
            <span class="muted">第 ${d.page} / ${d.pages} 页（共 ${d.total} 个）</span>
            <button class="ghost" ${d.page >= d.pages ? "disabled" : ""} data-next>下一页 →</button>`;
          const pv = nav.querySelector("[data-prev]"), nx = nav.querySelector("[data-next]");
          if (pv && !pv.disabled) pv.onclick = () => loadPath(null, d.page - 1);
          if (nx && !nx.disabled) nx.onclick = () => loadPath(null, d.page + 1);
          $("goalCard").appendChild(nav);
        }
        $("goalCard").querySelectorAll("[data-occ]").forEach((el) => {
          el.onclick = () => loadPathDetail(el.dataset.occ);
        });
      } catch (e) {
        $("goalCard").innerHTML = `<div class="empty">加载失败：${esc(e.message || e)}</div>`;
      }
    }

    function fmtTime(s) {
      try {
        const d = new Date(s);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      } catch (_) { return String(s || "").slice(0, 10); }
    }

    async function loadPathDetail(occId) {
      $("goalCard").innerHTML = '<div class="empty">加载中…</div>';
      $("compBox").innerHTML = ""; $("planBox").innerHTML = "";
      try {
        const d = await api("/v1/student/goal/overview?occupation_id=" + encodeURIComponent(occId));
        // has_goal 只说明「这岗位是不是我的目标」，不代表没数据 —— 诊断过但没锁定
        // 的岗位照样有能力报告和学习计划。原来这里直接 return，整页空白。
        if (!d.occupation || !d.occupation.id) {
          $("goalCard").innerHTML = '<div class="empty">查不到该岗位</div>';
          return;
        }
        renderGoalCard(d);
        renderCompetency(d);
        renderPlan(d);
        // 顶部插一个返回列表的入口
        const back = document.createElement("div");
        back.className = "bar";
        back.innerHTML = '<button class="ghost">← 返回岗位列表</button>';
        back.querySelector("button").onclick = () => loadPath();
        $("goalCard").prepend(back);
      } catch (e) {
        $("goalCard").innerHTML = `<div class="empty">加载失败：${esc(e.message || e)}</div>`;
      }
    }

    function renderGoalCard(d) {
      // advances_to 是 1:N —— next_levels 是全部向上方向，next_level 只是其中第一条
      // （后端保留它做兼容）。这里主推第一条，其余列在下面，完整多跳链路在岗位详情页。
      const o = d.occupation || {};
      const nls = d.next_levels || (d.next_level ? [d.next_level] : []);
      const nl = nls[0] || null;
      // 绑定的晋升链路：锁定目标时选的那条（没选则自动绑第一条）。
      // 后端已把 progression.next_target 排到 next_levels[0]，所以 nl 就是绑定的下一目标。
      const prog = d.progression && (d.progression.chain || []).length > 1 ? d.progression : null;
      const goals = d.goals || [];
      const others = goals.filter((g) => g.status !== "active");
      $("goalCard").innerHTML = `
        <div class="card" style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px">
          <div>
            <div class="row">
              <!-- 详情与「有没有锁定目标」解耦：诊断过就能看，标签只如实反映状态 -->
              ${(() => {
                const g = d.goal || {};
                if (!d.has_goal) return '<span class="tag">诊断记录</span>';
                return g.status === "active"
                  ? '<span class="tag" style="color:#34d399;border-color:#10b981">当前活跃目标</span>'
                  : '<span class="tag">历史目标</span>';
              })()}
              <span class="muted">归属：${esc((d.major || {}).name || "—")}</span>
              <span class="tag">${esc(matchScoreText(d.match_score, (d.assessment || {}).score_status))}</span>
            </div>
            <h3 style="margin:8px 0 4px">◎ ${esc(o.name || "")}
              <span class="tag">${esc(o.level_label || "—")}</span></h3>
            <div class="muted" style="max-width:640px">${esc((o.description || "暂无岗位职责描述").slice(0, 160))}</div>
            <div class="row" style="margin-top:12px">
              ${d.has_goal
                ? '<button class="ghost" id="btnSwitchGoal">↻ 更换目标</button>'
                : `<button class="ghost" id="btnLockGoal">◎ 锁定为目标</button>`}
              <button class="act" id="btnDiag" ${o.skill_count ? "" : "disabled"}
                      title="${o.skill_count ? "" : "该岗位尚未配置技能构成，无法测评"}">⚡ AI 智能诊断</button>
              <span class="muted">技能项 ${o.skill_count || 0}</span>
              ${o.skill_count ? "" : '<span class="tag" style="color:#f59e0b;border-color:#b45309">该岗位尚未配置技能构成，无法测评</span>'}
            </div>
            ${others.length ? `<div class="muted" style="margin-top:10px;font-size:12px">
              历史目标：${others.map((g) => esc(g.occupation_name)).join("、")}（测评结果仍可回看）</div>` : ""}
          </div>
          <div class="card" style="margin:0;background:#0b1220">
            ${prog ? `
              <div class="row" style="margin-bottom:6px">
                <span class="tag" style="color:#a78bfa;border-color:#7c3aed">🔗 已绑定晋升链路</span>
                ${prog.direction === "user_selected"
                  ? '<span class="muted" style="font-size:12px">你选定的</span>'
                  : '<span class="muted" style="font-size:12px">默认第一条</span>'}
                ${d.progression_stale
                  ? '<span class="tag" style="color:#f59e0b;border-color:#b45309">方向已变更，建议重选</span>'
                  : ""}</div>
              <div class="muted" style="font-size:12px;margin-bottom:10px;white-space:normal">
                ${(prog.chain || []).map((n, i) => {
                    const nm = n.missing ? "（岗位已下线）" : (n.name || "—");
                    const lv = n.level_name ? `<span style="opacity:.7">·${esc(n.level_name)}</span>` : "";
                    const cur = n.is_current ? "font-weight:600;color:#e5e7eb" : "";
                    return `<span style="${cur}">${esc(nm)}${lv}</span>`;
                  }).join(' <span style="opacity:.5">→</span> ')}
              </div>` : ""}
            ${nl ? `
              <div class="row"><span class="tag">↗ 下一级成长目标</span>
                <span class="tag">${esc(nl.level_label || "")}</span>
                ${prog && (prog.next_target || {}).id === nl.id
                  ? '<span class="muted" style="font-size:12px">来自绑定链路</span>'
                  : (nls.length > 1 ? `<span class="muted" style="font-size:12px">共 ${nls.length} 个方向</span>` : "")}</div>
              <h4 style="margin:8px 0">${esc(nl.name)} ›</h4>
              ${nls.length > 1 ? `<div class="muted" style="font-size:12px;margin:-4px 0 8px">
                还可以走：${nls.slice(1).map((n) => esc(n.name) + (n.level_label ? "（" + esc(n.level_label) + "）" : "")).join("、")}
                　<a href="#" id="lnkAllPaths" style="color:#60a5fa">看完整晋升链路 ›</a></div>` : ""}
              <div class="muted" style="font-size:12px">进阶解锁需具备的关键核心技能：</div>
              <div style="margin-top:6px">
                ${(nl.unlock_skills || []).length
                  ? nl.unlock_skills.map((s) => `<span class="tag">${esc(s.skill_name || s.skill_key)}${s.required_level ? " L" + s.required_level : ""}</span>`).join(" ")
                  : '<span class="muted">下一级岗位暂未配置技能构成</span>'}
              </div>
              <div class="muted" style="font-size:12px;margin-top:10px">
                💡 完成当前${esc(o.level_label || "")}胜任测评及阶段任务后，即可开启下一级发展阶段。</div>`
              : `<div class="row"><span class="tag">下一级成长目标</span></div>
                 <div class="muted" style="margin-top:8px">该岗位暂未配置晋升关系（advances_to 边覆盖约 1%），
                 补齐后此处会显示下一级岗位与进阶所需技能。</div>`}
          </div>
        </div>`;
      $("btnDiag").onclick = () => { location.href = "/assessment"; };
      // 完整多跳链路在岗位详情页的「岗位晋升链路」卡片里，这里只是入口
      const lap = $("lnkAllPaths");
      if (lap) lap.onclick = (ev) => {
        ev.preventDefault();
        openDetail({ id: o.id, name: o.name, level: o.level, desc: o.description });
      };
      // 两个按钮互斥出现（锁定过 → 更换；没锁过 → 锁定），各自判存在再挂事件
      const sw = $("btnSwitchGoal");
      if (sw) sw.onclick = () => {
        document.querySelector('.tabs button[data-tab="explore"]').click();
        toast("在岗位探索里选择新的目标岗位");
      };
      const lk = $("btnLockGoal");
      if (lk) lk.onclick = async () => {
        lk.disabled = true;
        try {
          // 与岗位探索页同一条路径：多个晋升方向时先让用户选一条绑定
          const path = await pickProgression(o.id);
          const body = { occupation_id: o.id };
          if (path) body.progression_path = path;
          await api("/v1/student/goal", { method: "PUT", body });
          toast("已锁定为学习目标" + (path ? `（晋升链路 ${path.length - 1} 跳）` : ""));
          loadGoal();                       // 刷新顶部目标条
          loadPathDetail(o.id);             // 重渲染本页，标签变「当前活跃目标」
        } catch (e) {
          toast("锁定失败：" + (e.message || e));
          lk.disabled = false;
        }
      };
    }

    function renderCompetency(d) {
      const rep = d.assessment;
      if (!rep) {
        $("compBox").innerHTML = `<div class="card"><b>胜任力能力报告与技能缺口分析</b>
          <div class="empty" style="margin-top:10px">该岗位尚无测评结果，点上方「AI 智能诊断」开始一次测评</div></div>`;
        return;
      }
      // 展示**完整的岗位技能构成**：本次没测到的、测出 0 分的也要列出来，
      // 否则运营会以为岗位只有这几项技能（管理台里明明配了 4 项，报告只显示 3 项）
      const items = (rep.items || []).slice().sort((a, b) => (b.weight || 0) - (a.weight || 0));
      const strengths = (rep.strengths || []).slice(0, 4);
      const gaps = (rep.gaps || []).slice(0, 4);
      $("compBox").innerHTML = `
        <div class="card">
          <div class="row"><b>🏅 胜任力能力报告与技能缺口分析</b>
            <span class="muted">对比个人实测水平与【${esc(d.occupation.name)}】能力等级要求</span>
            <button class="ghost" id="btnReDiag">✨ 重新 AI 测评</button></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px">
            <div>
              <div class="muted" style="font-size:12px;margin-bottom:6px">
                各维能力 当前 vs 目标标准（L1–L5）· 共 ${items.length} 项
                <span style="margin-left:6px">本次实测 ${(rep.counts || {}).tested ?? 0} 项</span></div>
              ${items.map((x) => {
                const w = x.tested ? Math.round((x.ratio || 0) * 100) : 0;
                const color = !x.tested ? "#475569" : (x.ok ? "#10b981" : "#f59e0b");
                return `
                <div style="margin-bottom:10px">
                  <div class="row" style="justify-content:space-between">
                    <span${x.tested ? "" : ' class="muted"'}>${esc(x.skill_name || x.skill_key)}
                      ${x.tested ? "" : '<span class="tag" style="margin-left:6px">未测评</span>'}</span>
                    <span class="muted">${x.tested ? "L" + (x.measured_level || 0) : "—"}
                      / 目标 L${x.required_level || "?"}
                      ${x.weight_pct != null ? `· 权重${x.weight_pct}%` : ""}</span>
                  </div>
                  <div class="bar-wrap"><div class="bar-in"
                    style="width:${w}%;background:${color}"></div></div>
                </div>`;
              }).join("") || '<div class="muted">该岗位尚未配置技能构成</div>'}
            </div>
            <div>
              <div class="muted" style="font-size:12px;margin-bottom:6px">核心技能缺口排查</div>
              <div class="card" style="margin:0 0 10px;background:#08201a">
                <b style="color:#34d399">✦ 优势精通（已达标）</b>
                <div class="muted" style="margin-top:6px">${strengths.length
                  ? strengths.map((x) => `${esc(x.skill_name || x.skill_key)}（L${x.measured_level}）`).join("、") + "，已满足岗位胜任标准。"
                  : "本次未测出达标项。"}</div>
              </div>
              <div class="card" style="margin:0;background:#231a08">
                <b style="color:#f59e0b">⚠ 关键能力缺口（待攻关）</b>
                <div class="muted" style="margin-top:6px">${gaps.length
                  ? gaps.map((x) => `${esc(x.skill_name || x.skill_key)}（L${x.measured_level || 0}→L${x.required_level}）`).join("、") + "。"
                  : "未发现明显缺口。"}</div>
              </div>
              <div class="muted" style="font-size:12px;margin-top:8px">
                💡 ${esc(matchScoreText(rep.match_score, rep.score_status))}${rep.match_score != null
                  ? `（本次覆盖岗位技能权重 ${rep.coverage != null ? rep.coverage + "%" : "—"}${
                      rep.no_baseline_weight ? ` · ${rep.no_baseline_weight}% 的能力要求待完善` : ""}）`
                  : ""}</div>
            </div>
          </div>
        </div>`;
      $("btnReDiag").onclick = () => { location.href = "/assessment"; };
    }

    /* 学习计划：服务端按诊断结果编排后推送到学习空间，本页只负责触发与回显。
       原先这里有一份 renderPlanMock() —— 用测评短板在前端拼假的三阶段任务树。
       服务端接通后必须删掉：两处各编一套阶段划分，学员看到的和实际推过去的对不上。 */
    async function genLearningPlan(d, btn) {
      const sid = (d.assessment || {}).session_id;
      if (!sid) { toast("请先完成一次诊断"); return; }
      const old = btn && btn.textContent;
      if (btn) { btn.disabled = true; btn.textContent = "生成中…"; }
      try {
        const r = await api("/v1/student/goal/learning-plan", {
          method: "POST",
          body: { session_id: sid },
        });
        toast(r.created
          ? `已生成学习计划：${r.phases_count} 个阶段 / ${r.tasks_count} 个任务`
          : "该次诊断已生成过计划，为你打开原有的");
        loadPathDetail(d.occupation.id);
      } catch (e) {
        // 降级没了，错误必须分类给文案：能重试的和要找人的不是一回事
        const s = e.status || 0;
        toast(
          s === 400 ? "这次诊断没有可用结果，请重新诊断后再试"
          : s === 404 ? "找不到该诊断记录"
          : s === 409 ? "岗位数据在生成期间发生变化，请联系管理员核对"
          : s === 502 ? "学习空间服务暂时不可用，请稍后重试"
          : "生成失败：" + (e.message || e)
        );
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = old; }
      }
    }

    function renderPlan(d) {
      const sid = (d.assessment || {}).session_id;
      const planId = d.learning_plan_id || "";
      $("planBox").innerHTML = `
        <div class="card">
          <div class="row"><b>🚀 自适应学习计划</b>
            ${planId ? `<span class="tag" style="color:#34d399;border-color:#10b981">已生成</span>` : ""}
            <button class="act" id="btnGenPlan" ${sid ? "" : "disabled"}>
              ${planId ? "重新生成" : "基于短板生成学习计划"}</button>
            <span class="muted">${sid
              ? "按诊断短板编排阶段任务，生成后在学习空间查看与推进"
              : "先完成一次 AI 诊断，系统才能依据短板编排计划"}</span></div>
          ${planId ? `<div class="step"><span class="t">计划 ID</span>
              <span class="muted">${esc(planId)}</span></div>` : ""}
          <div class="empty">阶段任务与学习进度在学习空间服务，本页不再重复展示</div>
        </div>`;
      const b = $("btnGenPlan");
      if (b) b.onclick = () => genLearningPlan(d, b);
    }

    /* ── 启动 ─────────────────────────────── */
    (async function boot() {
      try {
        if (!window.VocedApi) throw new Error("api-client.js 未加载");
        const r = await window.VocedApi.initAuth();
        if (r && r.redirecting) return;
        const u = window.VocedApi.getUser();
        $("who").textContent = "· 已登录 " + (u.name || u.id || "");
      } catch (e) {
        document.querySelector("main").innerHTML = `<div class="empty">需要 UC 登录：${esc(e.message || e)}</div>`;
        return;
      }
      $("btnSearch").onclick = search;
      $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
      await loadGoal();
      await search();
      // 测评页看完报告可直接跳回本页的路径 tab：/student?tab=path
      const want = new URLSearchParams(location.search).get("tab");
      const btn = want && document.querySelector(`.tabs button[data-tab="${want}"]`);
      if (btn) btn.click();
    })();
  </script>
</body>
</html>
