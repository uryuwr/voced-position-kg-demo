<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学员端 · 岗位探索与自适应提升（E2E 演示）</title>
  <script src="/js/api-client.js"></script>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
            --primary:#6366f1; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-size:14px;
           font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    header { padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
    header h1 { margin:0 0 3px; font-size:18px; }
    header .sub { color:var(--muted); font-size:12px; }
    .tabs { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
    .tabs button { background:#0b1220; color:var(--muted); border:1px solid var(--line);
                   border-radius:8px; padding:7px 14px; cursor:pointer; font-size:13px; }
    .tabs button.on { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:600; }
    main { padding:16px 20px 40px; }
    .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    input, select { background:#0b1220; color:var(--text); border:1px solid var(--line);
                    border-radius:8px; padding:8px 11px; font-size:13px; }
    input { min-width:220px; }
    button.act { background:var(--primary); color:#fff; border:0; border-radius:8px;
                 padding:8px 14px; cursor:pointer; font-size:13px; }
    button.ghost { background:transparent; color:var(--text); border:1px solid var(--line);
                   border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
    .card h3 { margin:0 0 6px; font-size:15px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .tag { font-size:11px; border-radius:999px; padding:2px 9px; background:#0b1220;
           border:1px solid var(--line); color:var(--muted); }
    .tag.lv { color:#a5b4fc; border-color:#4f46e5; }
    .tag.core { color:#fca5a5; border-color:#b91c1c; }
    .score { font-size:19px; font-weight:700; color:var(--ok); }
    .muted { color:var(--muted); font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:500; font-size:12px; }
    .bar-wrap { background:#0b1220; border-radius:6px; height:8px; overflow:hidden; min-width:110px; }
    .bar-in { height:100%; background:var(--ok); }
    .stage { border-left:3px solid var(--primary); padding-left:12px; margin-bottom:16px; }
    .step { display:flex; gap:10px; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line); }
    .step.done .t { text-decoration:line-through; color:var(--muted); }
    .step .t { flex:1; }
    textarea { width:100%; min-height:130px; background:#0b1220; color:var(--text);
               border:1px solid var(--line); border-radius:8px; padding:10px; font-size:13px; }
    .drop { border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center;
            color:var(--muted); cursor:pointer; }
    .drop.over { border-color:var(--primary); color:var(--text); }
    .toast { position:fixed; left:50%; top:14px; transform:translateX(-50%); background:#000;
             border:1px solid var(--line); padding:9px 16px; border-radius:8px; z-index:99; display:none; }
    .empty { color:var(--muted); padding:26px; text-align:center; }
    pre { background:#0b1220; border:1px solid var(--line); border-radius:8px; padding:10px;
          font-size:11px; overflow:auto; max-height:240px; }
  </style>
</head>
<body>
  <header>
    <h1>岗位探索与自适应提升中心</h1>
    <div class="sub">E2E 演示页：覆盖 岗位探索 / 岗位详情 / AI 诊断 / 自适应学习路径 四个模块（不还原视觉，重在打通功能）</div>
    <div class="bar" style="margin-top:10px">
      <span class="muted">当前锁定目标：</span><b id="goalName">未锁定</b>
      <span id="goalMatch" class="score"></span>
      <button class="ghost" id="btnClearGoal">清除目标</button>
      <span class="muted" id="who"></span>
    </div>
    <div class="tabs">
      <button data-tab="explore" class="on">① 岗位探索</button>
      <button data-tab="detail">② 岗位详情</button>
      <button data-tab="diag">③ AI 诊断</button>
      <button data-tab="path">④ 岗位学习与自适应路径</button>
    </div>
  </header>
  <main>
    <section id="tab-explore">
      <div class="bar">
        <input id="q" placeholder="搜索岗位名称，如 混凝土工 / 数据" />
        <button class="act" id="btnSearch">搜索</button>
        <span class="muted" id="exploreMeta"></span>
      </div>
      <div class="grid" id="posGrid"><div class="empty">点「搜索」加载岗位</div></div>
    </section>

    <section id="tab-detail" hidden>
      <div class="bar"><span class="muted">从「岗位探索」点卡片进入，或先搜索再选一个岗位</span></div>
      <div id="detailBox"><div class="empty">尚未选择岗位</div></div>
    </section>

    <section id="tab-diag" hidden>
      <div class="card" style="margin-bottom:12px">
        <h3>1. 简历解析推断</h3>
        <div class="bar">
          <button class="ghost" id="btnSample">使用范例简历一键体验</button>
          <span class="muted">或粘贴文本 / 拖拽文件（PDF、DOCX、TXT，≤20MB）</span>
        </div>
        <div class="drop" id="drop">拖拽简历文件到此处，或点击选择</div>
        <input type="file" id="file" accept=".pdf,.docx,.txt,.md" hidden />
        <textarea id="resumeText" placeholder="粘贴简历文本…" style="margin-top:10px"></textarea>
        <div class="bar" style="margin-top:8px">
          <button class="act" id="btnDiagText">文本诊断</button>
          <span class="muted" id="diagMeta"></span>
        </div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <h3>2. 对话问答测评</h3>
        <div class="bar">
          <button class="ghost" id="btnChatStart">开启会话</button>
          <input id="chatMsg" placeholder="输入你的回答…" style="flex:1" />
          <button class="act" id="btnChatSend">提交回答</button>
        </div>
        <div id="chatBox" class="muted">尚未开启会话</div>
      </div>
      <div class="card">
        <h3>3. 综合能力报告</h3>
        <button class="ghost" id="btnReport">刷新报告</button>
        <div id="reportBox"><div class="empty">尚无报告</div></div>
      </div>
    </section>

    <section id="tab-path" hidden>
      <!-- 顶部卡片：当前锁定目标 / 岗位晋升路径 / 测评结果，三者都按岗位绑定 -->
      <div id="goalCard"><div class="empty">加载中…</div></div>
      <!-- 胜任力能力报告与技能缺口分析 -->
      <div id="compBox"></div>
      <!-- 自适应学习计划：等后续提供的 API，当前为前端占位数据 -->
      <div id="planBox"></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
    const S = { positions: [], current: null, goal: null, session: null };

    function toast(m) { const t=$("toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none", 2800); }
    // UC MAC 签名基于完整 URL，同 URL 重复请求会被判重放 → 加自增序号
    let _n = 0;
    const api = (u, o) => window.VocedApi.apiFetch(u + (u.includes("?") ? "&" : "?") + "_n=" + (++_n), o || {});

    document.querySelectorAll(".tabs button").forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
        ["explore","detail","diag","path"].forEach((t) => { $("tab-" + t).hidden = t !== b.dataset.tab; });
        if (b.dataset.tab === "path") loadPath();
        if (b.dataset.tab === "diag") loadReport();
      };
    });

    /* ── ① 岗位探索 ─────────────────────────────── */
    async function search() {
      const q = $("q").value.trim();
      $("posGrid").innerHTML = '<div class="empty">加载中…</div>';
      try {
        const d = await api("/v1/student/positions?page_size=12" + (q ? "&q=" + encodeURIComponent(q) : ""));
        S.positions = d.items || [];
        $("exploreMeta").textContent = `共检索到 ${d.total ?? S.positions.length} 个岗位`;
        renderPositions();
      } catch (e) { $("posGrid").innerHTML = `<div class="empty">失败：${esc(e.message || e)}</div>`; }
    }
    function renderPositions() {
      if (!S.positions.length) { $("posGrid").innerHTML = '<div class="empty">无结果</div>'; return; }
      $("posGrid").innerHTML = S.positions.map((p, i) => `
        <div class="card">
          <div class="row">
            ${p.industry_name ? `<span class="tag">${esc(p.industry_name)}</span>` : ""}
            ${p.level ? `<span class="tag lv">L${p.level}</span>` : ""}
            ${p.salary ? `<span class="tag">${esc(p.salary)}</span>` : `<span class="tag muted">薪资待补</span>`}
            <span style="flex:1"></span>
            <span class="score" id="ms${i}">–</span>
          </div>
          <h3>${esc(p.name)}</h3>
          <div class="muted">${esc((p.desc || "").slice(0, 60))}</div>
          <div class="row" style="margin-top:10px">
            <button class="ghost" data-detail="${i}">岗位详情</button>
            <button class="ghost" data-lock="${i}">${S.goal && S.goal.occupation_id === p.id ? "已锁定" : "锁定目标"}</button>
            <button class="act" data-diag="${i}">AI 智能诊断</button>
          </div>
        </div>`).join("");
      $("posGrid").querySelectorAll("[data-detail]").forEach((el) => el.onclick = () => openDetail(S.positions[+el.dataset.detail]));
      $("posGrid").querySelectorAll("[data-lock]").forEach((el) => el.onclick = () => lockGoal(S.positions[+el.dataset.lock]));
      $("posGrid").querySelectorAll("[data-diag]").forEach((el) => el.onclick = () => {
        lockGoal(S.positions[+el.dataset.diag]).then(() => document.querySelector('[data-tab="diag"]').click());
      });
      S.positions.forEach((p, i) => loadMatch(p.id, "ms" + i));  // 匹配得分逐个异步填
    }
    async function loadMatch(pid, elId) {
      try {
        const d = await api("/v1/student/positions/match?position_id=" + encodeURIComponent(pid));
        const el = $(elId); if (el) el.textContent = (d.match_score ?? 0) + "%";
      } catch (e) { const el = $(elId); if (el) el.textContent = "–"; }
    }

    /* ── 目标锁定 ─────────────────────────────── */
    async function lockGoal(p) {
      if (!p) return;
      try {
        await api("/v1/student/goal", { method: "PUT", body: { occupation_id: p.id } });
        await loadGoal(); renderPositions(); toast("已锁定：" + p.name);
      } catch (e) { toast("锁定失败：" + (e.message || e)); }
    }
    async function loadGoal() {
      try {
        const g = await api("/v1/student/goal");
        S.goal = g && g.occupation_id ? g : null;
        $("goalName").textContent = S.goal ? (S.goal.occupation_name || S.goal.occupation_id) : "未锁定";
        $("goalMatch").textContent = "";
        if (S.goal) {
          const m = await api("/v1/student/positions/match?position_id=" + encodeURIComponent(S.goal.occupation_id));
          $("goalMatch").textContent = (m.match_score ?? 0) + "% 匹配";
        }
      } catch (e) { S.goal = null; $("goalName").textContent = "未锁定"; }
    }
    $("btnClearGoal").onclick = async () => {
      try { await api("/v1/student/goal", { method: "DELETE" }); await loadGoal(); renderPositions(); toast("已清除目标"); }
      catch (e) { toast("失败：" + (e.message || e)); }
    };

    /* ── ② 岗位详情 ─────────────────────────────── */
    async function openDetail(p) {
      if (!p) return;
      S.current = p;
      document.querySelector('[data-tab="detail"]').click();
      $("detailBox").innerHTML = '<div class="empty">加载中…</div>';
      try {
        const [comp, match] = await Promise.all([
          api("/v1/student/positions/skill-composition?id=" + encodeURIComponent(p.id)),
          api("/v1/student/positions/match?position_id=" + encodeURIComponent(p.id)).catch(() => null),
        ]);
        const skills = comp.skills || [];
        $("detailBox").innerHTML = `
          <div class="card">
            <div class="row">
              <h3 style="margin:0">${esc(p.name)}</h3>
              ${p.level ? `<span class="tag lv">L${p.level}</span>` : ""}
              <span style="flex:1"></span>
              <span class="score">${match ? (match.match_score + "% 匹配") : ""}</span>
            </div>
            <div class="muted" style="margin-top:6px">${esc(p.desc || "（岗位职责描述待补充）")}</div>
            <h3 style="margin-top:14px">岗位必备胜任力图谱</h3>
            <table>
              <tr><th>技能名称</th><th>要求等级</th><th>权重</th><th>类别</th><th>我的等级</th></tr>
              ${skills.map((s) => {
                const mi = match && (match.items || []).find((x) => x.skill_key === s.skill_key);
                return `<tr>
                  <td>${esc(s.skill_key || s.name)} ${s.is_core ? '<span class="tag core">核心</span>' : ""}</td>
                  <td>L${s.required_level ?? "-"}</td>
                  <td>${s.weight_pct != null ? s.weight_pct + "%" : "-"}</td>
                  <td class="muted">${esc(s.category || "未分类")}</td>
                  <td>${mi ? (mi.user_level ? "L" + mi.user_level : "—") : ""}</td>
                </tr>`;
              }).join("")}
            </table>
            <div class="muted" style="margin-top:8px">技能 ${comp.skill_count ?? skills.length} 项 · 权重合计 ${comp.weight_sum ?? "-"}</div>
            <div class="row" style="margin-top:12px">
              <button class="ghost" id="dLock">锁定目标</button>
              <button class="act" id="dDiag">AI 智能诊断</button>
            </div>
          </div>`;
        $("dLock").onclick = () => lockGoal(p);
        $("dDiag").onclick = () => lockGoal(p).then(() => document.querySelector('[data-tab="diag"]').click());
      } catch (e) { $("detailBox").innerHTML = `<div class="empty">失败：${esc(e.message || e)}</div>`; }
    }

    /* ── ③ AI 诊断 ─────────────────────────────── */
    $("btnSample").onclick = async () => {
      try { const d = await api("/v1/student/diagnosis/resume/sample"); $("resumeText").value = d.content_text; toast("已填入范例简历"); }
      catch (e) { toast("失败：" + (e.message || e)); }
    };
    $("btnDiagText").onclick = async () => {
      const t = $("resumeText").value.trim();
      if (!t) return toast("请先填写简历文本");
      $("diagMeta").textContent = "诊断中…";
      try {
        const d = await api("/v1/student/diagnosis/resume", { method: "POST", body: { content_text: t } });
        showDiag(d);
      } catch (e) { $("diagMeta").textContent = "失败：" + (e.message || e); }
    };
    function showDiag(d) {
      const eng = (d.agent_meta || {}).engine || "-";
      $("diagMeta").textContent = `解析 ${(d.parsed_skills || []).length} 项技能 · 引擎 ${eng}`;
      loadGoal(); loadReport();
      toast("诊断完成，匹配度 " + ((d.report || {}).match_score ?? "-") + "%");
    }
    // 文件上传
    const drop = $("drop");
    drop.onclick = () => $("file").click();
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
    $("file").onchange = (e) => { if (e.target.files[0]) upload(e.target.files[0]); };
    async function upload(f) {
      $("diagMeta").textContent = `上传解析中：${f.name}…`;
      const fd = new FormData(); fd.append("file", f);
      try {
        const d = await api("/v1/student/diagnosis/resume/upload", { method: "POST", body: fd });
        showDiag(d);
      } catch (e) { $("diagMeta").textContent = "失败：" + (e.message || e); toast(e.message || e); }
    }
    // 对话测评
    $("btnChatStart").onclick = async () => {
      try {
        const d = await api("/v1/student/diagnosis/chat/sessions", { method: "POST", body: {} });
        S.session = d.session_id;
        $("chatBox").innerHTML = `<div><b>Q：</b>${esc(d.first_question || "")}</div>`;
      } catch (e) { toast("失败：" + (e.message || e)); }
    };
    $("btnChatSend").onclick = async () => {
      if (!S.session) return toast("请先开启会话");
      const m = $("chatMsg").value.trim(); if (!m) return;
      try {
        const d = await api(`/v1/student/diagnosis/chat/sessions/${S.session}/messages`, { method: "POST", body: { content: m } });
        $("chatBox").innerHTML += `<div style="margin-top:8px"><b>我：</b>${esc(m)}</div>
          <div><b>AI：</b>${esc(d.reply || "")} <span class="muted">(${(d.skills || []).length} 项技能线索)</span></div>`;
        $("chatMsg").value = ""; loadReport();
      } catch (e) { toast("失败：" + (e.message || e)); }
    };
    // 报告
    $("btnReport").onclick = () => loadReport();
    async function loadReport() {
      try {
        const d = await api("/v1/student/diagnosis/report");
        if (!d) { $("reportBox").innerHTML = '<div class="empty">尚无报告</div>'; return; }
        const radar = d.radar || { categories: [], scores: [] };
        const gaps = d.gaps || [];
        $("reportBox").innerHTML = `
          <div class="row" style="margin:8px 0"><span class="score">${d.match_score ?? 0}%</span>
            <span class="muted">${esc(d.summary || "")}</span></div>
          <h3 style="font-size:14px">各维能力达标率</h3>
          <table>${radar.categories.map((c, i) => `
            <tr><td style="width:150px">${esc(c)}</td>
              <td><div class="bar-wrap"><div class="bar-in" style="width:${radar.scores[i] || 0}%"></div></div></td>
              <td style="width:50px">${radar.scores[i] || 0}%</td></tr>`).join("")}</table>
          <h3 style="font-size:14px;margin-top:14px">关键能力缺口（按权重）</h3>
          <table>${gaps.slice(0, 8).map((g) => `
            <tr><td>${esc(g.skill_name || "")}</td>
              <td class="muted">${esc(g.category || "")}</td>
              <td>L${g.user_level ?? 0} → L${g.required_level ?? "-"}</td>
              <td>${g.weight_pct != null ? g.weight_pct + "%" : ""}</td></tr>`).join("") || '<tr><td class="muted">无缺口</td></tr>'}</table>`;
      } catch (e) { $("reportBox").innerHTML = `<div class="empty">失败：${esc(e.message || e)}</div>`; }
    }

    /* ── ④ 岗位学习与自适应路径 ───────────────────────
       顶部卡片三块数据都来自 GET /v1/student/goal/overview，按岗位绑定：
       换目标即换整套（目标 / 晋升路径 / 该岗位的测评结果）。          */
    async function loadPath() {
      try {
        const d = await api("/v1/student/goal/overview");
        if (!d.has_goal) {
          $("goalCard").innerHTML = '<div class="empty">尚未锁定目标岗位，请先到「岗位探索」锁定一个</div>';
          $("compBox").innerHTML = ""; $("planBox").innerHTML = "";
          return;
        }
        renderGoalCard(d);
        renderCompetency(d);
        renderPlanMock(d);
      } catch (e) {
        $("goalCard").innerHTML = `<div class="empty">加载失败：${esc(e.message || e)}</div>`;
      }
    }

    function renderGoalCard(d) {
      const o = d.occupation || {}, nl = d.next_level;
      const goals = d.goals || [];
      const others = goals.filter((g) => g.status !== "active");
      $("goalCard").innerHTML = `
        <div class="card" style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px">
          <div>
            <div class="row">
              <span class="tag">当前活跃目标</span>
              <span class="muted">归属：${esc((d.major || {}).name || "—")}</span>
              <span class="tag">${d.match_score != null ? "匹配度 " + d.match_score + "%" : "未测评"}</span>
            </div>
            <h3 style="margin:8px 0 4px">◎ ${esc(o.name || "")}
              <span class="tag">${esc(o.level_label || "—")}</span></h3>
            <div class="muted" style="max-width:640px">${esc((o.description || "暂无岗位职责描述").slice(0, 160))}</div>
            <div class="row" style="margin-top:12px">
              <button class="ghost" id="btnSwitchGoal">↻ 更换目标</button>
              <button class="act" id="btnDiag">⚡ AI 智能诊断</button>
              <span class="muted">技能项 ${o.skill_count || 0}</span>
            </div>
            ${others.length ? `<div class="muted" style="margin-top:10px;font-size:12px">
              历史目标：${others.map((g) => esc(g.occupation_name)).join("、")}（测评结果仍可回看）</div>` : ""}
          </div>
          <div class="card" style="margin:0;background:#0b1220">
            ${nl ? `
              <div class="row"><span class="tag">↗ 下一级成长目标</span>
                <span class="tag">${esc(nl.level_label || "")}</span></div>
              <h4 style="margin:8px 0">${esc(nl.name)} ›</h4>
              <div class="muted" style="font-size:12px">进阶解锁需具备的关键核心技能：</div>
              <div style="margin-top:6px">
                ${(nl.unlock_skills || []).length
                  ? nl.unlock_skills.map((s) => `<span class="tag">${esc(s.skill_key)}${s.required_level ? " L" + s.required_level : ""}</span>`).join(" ")
                  : '<span class="muted">下一级岗位暂未配置技能构成</span>'}
              </div>
              <div class="muted" style="font-size:12px;margin-top:10px">
                💡 完成当前${esc(o.level_label || "")}胜任测评及阶段任务后，即可开启下一级发展阶段。</div>`
              : `<div class="row"><span class="tag">下一级成长目标</span></div>
                 <div class="muted" style="margin-top:8px">该岗位暂未配置晋升关系（advances_to 边覆盖约 1%），
                 补齐后此处会显示下一级岗位与进阶所需技能。</div>`}
          </div>
        </div>`;
      $("btnDiag").onclick = () => { location.href = "/assessment"; };
      $("btnSwitchGoal").onclick = () => {
        document.querySelector('.tabs button[data-tab="explore"]').click();
        toast("在岗位探索里选择新的目标岗位");
      };
    }

    function renderCompetency(d) {
      const rep = d.assessment;
      if (!rep) {
        $("compBox").innerHTML = `<div class="card"><b>胜任力能力报告与技能缺口分析</b>
          <div class="empty" style="margin-top:10px">该岗位尚无测评结果，点上方「AI 智能诊断」开始一次测评</div></div>`;
        return;
      }
      const items = (rep.items || []).filter((x) => x.tested).slice(0, 8);
      const strengths = (rep.strengths || []).slice(0, 4);
      const gaps = (rep.gaps || []).slice(0, 4);
      $("compBox").innerHTML = `
        <div class="card">
          <div class="row"><b>🏅 胜任力能力报告与技能缺口分析</b>
            <span class="muted">对比个人实测水平与【${esc(d.occupation.name)}】能力等级要求</span>
            <button class="ghost" id="btnReDiag">✨ 重新 AI 测评</button></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px">
            <div>
              <div class="muted" style="font-size:12px;margin-bottom:6px">各维能力 当前 vs 目标标准（L1–L5）</div>
              ${items.map((x) => `
                <div style="margin-bottom:10px">
                  <div class="row" style="justify-content:space-between">
                    <span>${esc(x.skill_key)}</span>
                    <span class="muted">L${x.measured_level || 0} / 目标 L${x.required_level || "?"}</span>
                  </div>
                  <div class="bar-wrap"><div class="bar-in" style="width:${Math.round((x.ratio || 0) * 100)}%;
                    background:${x.ok ? "#10b981" : "#f59e0b"}"></div></div>
                </div>`).join("") || '<div class="muted">无实测维度</div>'}
            </div>
            <div>
              <div class="muted" style="font-size:12px;margin-bottom:6px">核心技能缺口排查</div>
              <div class="card" style="margin:0 0 10px;background:#08201a">
                <b style="color:#34d399">✦ 优势精通（已达标）</b>
                <div class="muted" style="margin-top:6px">${strengths.length
                  ? strengths.map((x) => `${esc(x.skill_key)}（L${x.measured_level}）`).join("、") + "，已满足岗位胜任标准。"
                  : "本次未测出达标项。"}</div>
              </div>
              <div class="card" style="margin:0;background:#231a08">
                <b style="color:#f59e0b">⚠ 关键能力缺口（待攻关）</b>
                <div class="muted" style="margin-top:6px">${gaps.length
                  ? gaps.map((x) => `${esc(x.skill_key)}（L${x.measured_level || 0}→L${x.required_level}）`).join("、") + "。"
                  : "未发现明显缺口。"}</div>
              </div>
              <div class="muted" style="font-size:12px;margin-top:8px">
                💡 匹配度 ${rep.match_score}%（本次覆盖岗位技能权重 ${rep.coverage != null ? rep.coverage + "%" : "—"}）</div>
            </div>
          </div>
        </div>`;
      $("btnReDiag").onclick = () => { location.href = "/assessment"; };
    }

    /* 自适应学习计划：服务端 API 后续提供，这里先用测评短板拼占位数据，
       只为把「短板 → 学习任务」的信息流走通，不落库、不调接口。 */
    function renderPlanMock(d) {
      const rep = d.assessment || {};
      const gaps = (rep.gaps || []).slice(0, 4);
      const seed = gaps.length ? gaps : ((d.next_level || {}).unlock_skills || []).slice(0, 3)
        .map((s) => ({ skill_key: s.skill_key, measured_level: 0, required_level: s.required_level }));
      const stages = [
        { t: "基础夯实", d: "补齐概念与规范，能在指导下完成常规任务", pct: 0 },
        { t: "实战演练", d: "独立完成典型任务并处理常见异常", pct: 0 },
        { t: "进阶攻坚", d: "优化方法、沉淀标准，具备指导他人的能力", pct: 0 },
      ];
      $("planBox").innerHTML = `
        <div class="card">
          <div class="row"><b>🚀 自适应学习计划</b>
            <span class="tag" style="background:#3b2f0b;color:#f59e0b">前端占位数据</span>
            <span class="muted">学习计划服务端接口待接入，当前按测评短板生成示意</span></div>
          ${seed.length ? stages.map((g, i) => `
            <div class="stage">
              <div class="row"><b>第 ${i + 1} 阶段 · ${g.t}</b>
                <span class="tag">${g.pct}%</span>
                <span class="muted">${g.d}</span></div>
              ${seed.map((s) => `
                <div class="step">
                  <span class="t">${esc(s.skill_key)} · ${g.t}任务</span>
                  <span class="muted">目标 L${s.required_level || "?"}
                    ${s.measured_level ? `（当前 L${s.measured_level}）` : ""} · 预计 45 分钟</span>
                  <button class="ghost" disabled>待接入</button>
                </div>`).join("")}
            </div>`).join("")
            : '<div class="empty">先完成一次 AI 测评，系统会依据短板生成学习计划</div>'}
        </div>`;
    }

    /* ── 启动 ─────────────────────────────── */
    (async function boot() {
      try {
        if (!window.VocedApi) throw new Error("api-client.js 未加载");
        const r = await window.VocedApi.initAuth();
        if (r && r.redirecting) return;
        const u = window.VocedApi.getUser();
        $("who").textContent = "· 已登录 " + (u.name || u.id || "");
      } catch (e) {
        document.querySelector("main").innerHTML = `<div class="empty">需要 UC 登录：${esc(e.message || e)}</div>`;
        return;
      }
      $("btnSearch").onclick = search;
      $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
      await loadGoal();
      await search();
      // 测评页看完报告可直接跳回本页的路径 tab：/student?tab=path
      const want = new URLSearchParams(location.search).get("tab");
      const btn = want && document.querySelector(`.tabs button[data-tab="${want}"]`);
      if (btn) btn.click();
    })();
  </script>
</body>
</html>
