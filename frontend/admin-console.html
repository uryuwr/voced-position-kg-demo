<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理端 · 职业教育知识图谱</title>
  <script src="/js/api-client.js"></script>
  <style>
    :root {
      --bg: #f1f5f9; --panel: #fff; --line: #e2e8f0; --line2: #cbd5e1;
      --text: #0f172a; --muted: #64748b; --primary: #2563eb; --ok: #059669;
      --warn: #d97706; --bad: #dc2626; --ink: #1e293b; --sb: 220px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text); background: var(--bg);
      display: flex; flex-direction: column;
    }
    .top {
      height: 52px; background: var(--panel); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 12px; padding: 0 16px; flex-shrink: 0;
    }
    .top .logo { font-weight: 700; font-size: 15px; }
    .top .badge {
      font-size: 11px; color: #0369a1; background: #e0f2fe; border: 1px solid #bae6fd;
      padding: 2px 8px; border-radius: 999px; font-weight: 600;
    }
    .top .grow { flex: 1; }
    .top .user-box {
      display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
    }
    .top .user-box input {
      width: 110px; border: 1px solid var(--line2); border-radius: 6px;
      padding: 5px 8px; font-size: 12px; font-family: inherit;
    }
    .top a.doc { font-size: 12px; color: var(--primary); text-decoration: none; margin-left: 8px; }
    .top a.doc:hover { text-decoration: underline; }
    .shell { flex: 1; display: flex; min-height: 0; }
    .sider {
      width: var(--sb); background: var(--panel); border-right: 1px solid var(--line);
      padding: 12px 10px; overflow: auto; flex-shrink: 0;
    }
    .nav-sec { font-size: 11px; font-weight: 700; color: var(--muted); margin: 12px 8px 6px; letter-spacing: .04em; }
    .nav-item {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      padding: 9px 12px; border-radius: 8px; font-size: 13px; color: var(--text);
      cursor: pointer; font-family: inherit; margin-bottom: 2px;
    }
    .nav-item:hover { background: #f8fafc; }
    .nav-item.on { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    .main { flex: 1; overflow: auto; padding: 18px 20px 40px; }
    .page-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .page-h h1 { margin: 0; font-size: 20px; }
    .page-h p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; box-shadow: 0 1px 2px rgba(15,23,42,.04);
    }
    .card .k { font-size: 12px; color: var(--muted); }
    .card .v { font-size: 22px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .toolbar input, .toolbar select {
      border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px;
      font-size: 13px; font-family: inherit; background: #fff;
    }
    .toolbar input[type="search"] { min-width: 200px; }
    .btn {
      border: 1px solid var(--line2); background: #fff; border-radius: 8px;
      padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit; color: var(--text);
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
    .btn.primary:hover { filter: brightness(1.05); color: #fff; }
    .btn.danger { color: var(--bad); border-color: #fecaca; }
    .btn.ok { color: var(--ok); border-color: #a7f3d0; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.04);
    }
    table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data th, table.data td {
      padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top;
    }
    table.data th { background: #f8fafc; font-size: 12px; color: var(--muted); font-weight: 600; }
    table.data tr:hover td { background: #fafbfc; }
    .tag {
      display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px;
      background: #f1f5f9; color: var(--muted); border: 1px solid var(--line);
    }
    .tag.pub { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .tag.draft { background: #fffbeb; color: #b45309; border-color: #fcd34d; }
    .tag.arch { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .tag.pend { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .tag.mixed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
    .toolbar select {
      height: 34px; border: 1px solid var(--line); border-radius: 8px;
      padding: 0 10px; font-size: 13px; background: #fff; color: var(--text);
    }
    .pager { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 12px; color: var(--muted); }
    .muted { color: var(--muted); font-size: 12px; }
    .empty { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }
    /* 能力全景 */
    .cap-root { padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .cap-occ { border-bottom: 1px solid var(--line); }
    .cap-occ-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
    .cap-occ-h:hover { background: #f8fafc; }
    .cap-lv { flex-shrink: 0; font-size: 12px; font-weight: 700; color: #166534; background: #dcfce7; border-radius: 999px; padding: 2px 8px; }
    .cap-nm { flex: 1; }
    .cap-sks { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px 44px; }
    .cap-sk { font-size: 12px; background: #eef2f7; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
    .toast {
      position: fixed; right: 16px; bottom: 16px; z-index: 100;
      background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 10px;
      font-size: 13px; max-width: 360px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }
    .toast.on { display: block; }
    .toast.err { background: #991b1b; }
    .modal-mask {
      position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 90;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-mask.on { display: flex; }
    .modal {
      background: #fff; border-radius: 14px; width: min(520px, 100%);
      max-height: 90vh; overflow: auto; padding: 18px 18px 14px;
      box-shadow: 0 20px 50px rgba(15,23,42,.25);
    }
    /* 技能构成 / 四维详情：表格列多，520px 挤不下，改用宽版 */
    .modal.wide { width: min(1080px, 100%); }
    .modal.wide .form-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .modal.wide .form-row > label { width: 92px; flex: none; margin: 0; }
    .modal.wide .form-row > div { flex: 1; }
    /* 头部信息紧凑成两列，避免一项占一行把表格挤到屏外 */
    .modal.wide .kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px; margin-bottom: 12px; }
    .modal.wide .kv-grid .kv { display: flex; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
    .modal.wide .kv-grid .kv b { color: var(--muted); font-weight: 500; min-width: 68px; }
    .modal.wide table.data { table-layout: auto; }
    .modal.wide table.data td, .modal.wide table.data th { white-space: nowrap; }
    .lv-btns { display: flex; gap: 4px; }
    .lv-btns .btn { padding: 3px 9px; font-size: 12px; min-width: 34px; }
    .modal h2 { margin: 0 0 12px; font-size: 16px; }
    .form-row { margin-bottom: 10px; }
    .form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; border: 1px solid var(--line2); border-radius: 8px;
      padding: 8px 10px; font-size: 13px; font-family: inherit;
    }
    .form-row textarea { min-height: 72px; resize: vertical; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 4px; }
    .name-cell { font-weight: 600; max-width: 280px; word-break: break-word; }
    .id-cell { font-size: 11px; color: var(--muted); word-break: break-all; max-width: 200px; }
    .warn-banner {
      background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
      padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 12px;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 800px) {
      .sider { display: none; }
      .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <span class="logo">管理端</span>
    <span class="badge">CN · PG</span>
    <span class="grow"></span>
    <div class="user-box" title="UC 登录用户；开发旁路可改测试 uid">
      <span id="userLabel">未登录</span>
      <span id="bypassBox" style="display:none">
        <input id="uid" placeholder="X-Test-Uid" style="width:90px" />
        <input id="uname" placeholder="X-Test-Uname" style="width:90px" />
        <button class="btn" type="button" id="btnSaveUser">保存旁路</button>
      </span>
    </div>
    <a class="doc" href="/docs" target="_blank">API 文档</a>
    <a class="doc" href="/admin-cytoscape">图探索</a>
  </header>
  <div class="shell">
    <aside class="sider" id="sider"></aside>
    <main class="main" id="main"></main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modal"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const api = window.VocedApi;
    const TYPE_ZH = {
      industry: "行业", major: "专业", occupation: "岗位",
      skill_level: "技能", course: "课程", credential: "认证",
    };
    const DIMS = [
      { type: "industry", label: "行业管理", nav: "industry" },
      { type: "major", label: "专业管理", nav: "major" },
      { type: "occupation", label: "岗位模型", nav: "occupation" },
      { type: "skill_level", label: "技能库", nav: "skill" },
    ];
    // 待发布清单里的维度名与失败码文案（清单是跨维度的，不能复用 DIMS 的页面标题）
    const DIM_ZH = {
      industry: "行业", major: "专业", occupation: "岗位", skill_level: "技能",
      course: "课程", credential: "认证",
    };
    const CODE_ZH = {
      published: "已发布", gate_failed: "门禁未通过", conflict: "版本冲突（需刷新重编辑）",
      code_conflict: "编码被占用", missing_endpoints: "端点尚未发布", not_found: "草稿已不存在",
    };

    const state = {
      view: "dash",
      listType: "major",
      q: "",
      statusFilter: "", // ""=全部 | published|draft|disabled
      // 待发布页上次发布/批量发布的结果横幅。**必须存在 state 里**：
      // 发布后要 render() 重新拉清单，而 render 会重建 main.innerHTML，
      // 直接写进 DOM 的横幅会被这次重建冲掉，运营根本看不到失败原因
      draftMsg: null,
      page: 1,
      pageSize: 20,
      total: 0,
      totalPages: 0,
      items: [],
      loading: false,
      listMode: "nodes", // nodes | skill_bundle
      proposals: [],
      reviewRequired: false, // 与 /v1/config.review_required 同步；默认无审核直写
      // 边管理
      edgeRel: "",
      edgeNodeId: "",
      edgeQ: "",
      edgePage: 1,
      edgePageSize: 20,
      edgeTotal: 0,
      edgeTotalPages: 0,
      edgeItems: [],
      // 能力全景
      capQ: "大数据技术",
      capData: null,
      capOpen: {},
    };
    const STATUS_FILTER_OPTS = [
      { v: "", lab: "全部状态" },
      { v: "published", lab: "已发布" },
      { v: "draft", lab: "草稿" },
      { v: "disabled", lab: "已停用" },
    ];
    const REL_OPTS = [
      "", "belongs_to", "prepares_for", "requires", "parent_of",
      "related_to", "taught_by",
    ];

    function toast(msg, err) {
      const el = $("toast");
      el.textContent = typeof msg === "string" ? msg : JSON.stringify(msg);
      el.className = "toast on" + (err ? " err" : "");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("on"), 3200);
    }

    // 拿不到状态时显示「未知」，**绝不兜底成某个业务状态**。
    // 这个项目栽过多次同一个形状：把「没数据」渲染成一个确定的业务结论
    // （match_score ?? 0 把「算不出来」显示成「完全不匹配」）。
    // 技能库上一版就是 `n.status || "draft"`，接口不返回 status → 21074 个技能
    // 全部显示「草稿」，而草稿标记正是这个功能的核心信号。
    function statusTag(s, label) {
      const v = s || "unknown";
      const map = {
        unknown: ["", "未知"],
        published: ["pub", "已发布"],
        disabled: ["arch", "已停用"],
        draft: ["draft", "草稿"],
        archived: ["arch", "已归档"],
        pending: ["pend", "待审核"],
        mixed: ["mixed", "混合"],
      };
      const [cls, lab] = map[v] || ["", v];
      return `<span class="tag ${cls}">${esc(label || lab)}</span>`;
    }
    /** 一行数据的「记录状态」：草稿优先。四维节点与技能 bundle 都用它，
     *  两处各写一遍迟早分家 —— 技能库那次就是这么漏的。
     *  拿不到任何状态字段时返回 undefined，交给 statusTag 显示「未知」。 */
    function recordStatusOf(n) {
      return n.record_status || n.status || undefined;
    }
    /** 这一行该显示「发布」还是「停用」：有草稿 → 发布；已发布 → 停用。 */
    function needsPublish(n) {
      return recordStatusOf(n) !== "published";
    }
    const PENDING_ACT_ZH = {
      update: "有待审编辑",
      delete: "有待审删除",
      disable: "有待审停用",
      enable: "有待审发布",
      create: "有待审新建",
    };
    /** 记录状态 = 最新版本的状态：有草稿就是「草稿」，否则取库内生效状态。
     *
     * 优先读 `record_status`（服务端按**发布单元**算：节点字段有草稿、或只改了
     * 技能构成/关联都算 draft）。只看 `status` 的话，「只改了技能构成」那种
     * 线上行 status 还是 published，列表上就看不出这条数据有未发布的改动。
     * 待审提案（pending_*）是另一维，仍然叠加显示。
     */
    function nodeStatusCell(n) {
      const st = recordStatusOf(n);
      let html = statusTag(st);
      if (n.pending_action) {
        const tip = PENDING_ACT_ZH[n.pending_action] || "有待审";
        html += ` <span class="tag pend" title="审核通过后才生效">#${esc(n.pending_change_id)} ${esc(tip)}</span>`;
      }
      return html;
    }
    function reviewOn() {
      return !!state.reviewRequired;
    }
    /** 操作文案：无审核直写 vs 进待审 */
    function actMsg(done, pending) {
      return reviewOn() ? pending : done;
    }
    function saveBtnLabel() {
      return reviewOn() ? "提交审核" : "保存生效";
    }
    function stayAndReload(msg) {
      toast(msg || actMsg("已保存生效", "已提交审核"));
      render();
    }
    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    /* ---------- auth ---------- */
    async function bootAuth() {
      const main = $("main");
      main.innerHTML = `<div class="empty">正在登录 UC…</div>`;
      try {
        const r = await api.initAuth();
        if (r && r.redirecting) return false;
        const u = api.getUser();
        $("userLabel").textContent = `${u.name} (${u.id})`;
        const cfg = r.config || (await api.loadConfig());
        state.reviewRequired = !!cfg.review_required;
        if (cfg.auth_bypass) {
          $("bypassBox").style.display = "";
          $("uid").value = u.id;
          $("uname").value = u.name;
          $("btnSaveUser").onclick = () => {
            api.setUser($("uid").value, $("uname").value);
            $("userLabel").textContent = `${$("uname").value} (${$("uid").value})`;
            toast("已保存开发旁路身份");
          };
        }
        return true;
      } catch (e) {
        main.innerHTML = `<div class="empty">登录失败：${esc(e.message || e)}<br/><span class="muted">本地可设 AUTH_BYPASS=1</span></div>`;
        return false;
      }
    }

    /* ---------- nav ---------- */
    function renderSider() {
      const items = [
        { sec: "运营", id: "dash", label: "运营看板" },
        { sec: "能力建模", id: "industry", label: "行业管理" },
        { id: "major", label: "专业管理" },
        { id: "occupation", label: "岗位模型" },
        { id: "skill", label: "技能库" },
        { id: "edges", label: "边管理" },
        { id: "edgeReview", label: "AI边抽检" },
        { sec: "治理", id: "create", label: "手工建数" },
        { id: "drafts", label: "待发布" },
        { id: "review", label: "审核发布" },
        { sec: "图谱", id: "kgexp", label: "知识图谱（行业入口）" },
        { sec: "图谱", id: "graph", label: "知识图谱（探索）" },
        { sec: "图谱", id: "capability", label: "能力全景" },
      ];
      let html = "";
      let lastSec = null;
      items.forEach((it) => {
        if (it.sec && it.sec !== lastSec) {
          html += `<div class="nav-sec">${esc(it.sec)}</div>`;
          lastSec = it.sec;
        }
        html += `<button type="button" class="nav-item ${state.view === it.id ? "on" : ""}" data-nav="${it.id}">${esc(it.label)}</button>`;
      });
      $("sider").innerHTML = html;
      $("sider").querySelectorAll("[data-nav]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.dataset.nav;
          if (id === "kgexp") { location.href = "/kg"; return; }
          if (id === "graph") { location.href = "/admin-cytoscape"; return; }
          if (id === "capability") { state.view = "capability"; render(); return; }
          state.view = id;
          if (DIMS.some((d) => d.nav === id)) {
            state.listType = DIMS.find((d) => d.nav === id).type;
            state.page = 1;
            state.q = "";
            state.statusFilter = "";
          }
          render();
        };
      });
    }

    /* ---------- pages ---------- */
    async function render() {
      renderSider();
      const main = $("main");
      main.innerHTML = `<div class="empty">加载中…</div>`;
      try {
        if (state.view === "dash") await viewDash(main);
        else if (DIMS.some((d) => d.nav === state.view)) await viewDimList(main);
        else if (state.view === "edges") await viewEdges(main);
        else if (state.view === "edgeReview") await viewEdgeReview(main);
        else if (state.view === "create") viewCreate(main);
        else if (state.view === "drafts") await viewDrafts(main);
        else if (state.view === "review") await viewReview(main);
        else if (state.view === "capability") await viewCapability(main);
        else main.innerHTML = `<div class="empty">未知视图</div>`;
      } catch (e) {
        const msg = e.message || String(e);
        const hint = e.status === 401
          ? "（UC MAC 鉴权失败：请重新登录，或检查签名是否含完整 URL query）"
          : "";
        main.innerHTML = `<div class="empty">加载失败：${esc(msg)}${esc(hint)}</div>`;
        toast(msg, true);
      }
    }

    /* ---------- 能力全景（专业 → 行业/岗位(层级) → 技能） ---------- */
    async function viewCapability(main) {
      main.innerHTML = `
        <div class="page-h">
          <div>
            <h1>能力全景</h1>
            <p>专业 → 所属行业 / 对口岗位（层级） → 岗位所需技能 · 仅展示已发布数据 · GET /v1/capability</p>
          </div>
        </div>
        <div class="toolbar">
          <input type="search" id="capQ" placeholder="输入专业名，如 大数据技术 / 软件技术" value="${esc(state.capQ)}" />
          <button class="btn primary" type="button" id="btnCap">查询</button>
        </div>
        <div class="panel" id="capBody"><div class="empty">加载中…</div></div>
      `;
      $("btnCap").onclick = () => {
        state.capQ = $("capQ").value.trim();
        state.capOpen = {};
        loadCapability();
      };
      $("capQ").onkeydown = (e) => { if (e.key === "Enter") $("btnCap").click(); };
      await loadCapability();
    }

    async function loadCapability() {
      const box = $("capBody");
      if (!box) return;
      const q = state.capQ;
      if (!q) { box.innerHTML = `<div class="empty">请输入专业名后查询</div>`; return; }
      box.innerHTML = `<div class="empty">加载中…</div>`;
      try {
        state.capData = await api.apiFetch("/v1/capability?major=" + encodeURIComponent(q));
        renderCapabilityBody();
      } catch (e) {
        state.capData = null;
        const msg = e.status === 404 ? `未找到专业「${q}」` : (e.message || String(e));
        box.innerHTML = `<div class="empty">${esc(msg)}</div>`;
      }
    }

    /** 悬停/点击岗位时按需拉技能（渐进式：默认视图不带技能明细） */
    async function loadOccSkills(occId) {
      state.capSkills = state.capSkills || {};
      if (state.capSkills[occId]) return;
      state.capSkills[occId] = "loading";
      try {
        const rows = await api.apiFetch(
          "/v1/occupations/skills?aggregate=true&limit=200&occupation_id=" + encodeURIComponent(occId)
        );
        state.capSkills[occId] = Array.isArray(rows) ? rows : [];
      } catch (e) {
        state.capSkills[occId] = [];
      }
      renderCapabilityBody();
    }

    function renderCapabilityBody() {
      const box = $("capBody");
      const d = state.capData;
      if (!box || !d) return;
      state.capSkills = state.capSkills || {};
      const root = d.root || {};
      const meta = d.meta || {};
      const inds = (d.industries || []).map((i) => esc(i.display_name || i.name)).join(" / ")
        || `<span class="muted">（未关联行业）</span>`;

      // 晋升链：默认视图的主问题之一「怎么晋升」
      const progs = d.progressions || [];
      const progHtml = progs.length
        ? `<div class="cap-root"><b>晋升链</b> <span class="muted">（${progs.length} 条 · 由岗位层级派生）</span>
             <div style="margin-top:6px">${progs.map((p) => {
               // 用服务端派生的 level_code；自己拼 'L'+level 在 level 为空时会出 "Lundefined"
               const tag = (c, n) => (c ? `${c}${n ? "·" + n : ""} ` : "");
               return `<div class="muted">${tag(p.from_level_code, p.from_level_name)}${esc(p.from_name)}`
                 + ` → ${tag(p.to_level_code, p.to_level_name)}${esc(p.to_name)}</div>`;
             }).join("")}</div>
           </div>`
        : `<div class="cap-root"><b>晋升链</b>
             <div class="muted">暂无。当前岗位来自「职业分类大典」，该数据源不含职级维度，
             待企业职级表 / 招聘级别数据接入后自动生效。</div>
           </div>`;

      // 共享技能：高频技能提到这里展示，避免图上星形汇聚
      const shared = d.shared_skills || [];
      const sharedHtml = shared.length
        ? `<div class="cap-root"><b>共享技能</b>
             <span class="muted">（被 ≥2 个岗位共同要求，共 ${shared.length} 项）</span>
             <div style="margin-top:6px">${shared.map((s) =>
               `<span class="cap-sk">${esc(s.skill_key)} <b>×${s.occ_count}</b></span>`
             ).join("")}</div>
           </div>`
        : "";

      const occs = (d.occupations || []).map((o, i) => {
        const open = !!state.capOpen[i];
        const cnt = o.skill_count != null ? o.skill_count : (o.skills || []).length;
        const cached = state.capSkills[o.id];
        let skillHtml = "";
        if (open) {
          if (cached === "loading") {
            skillHtml = `<span class="muted">加载中…</span>`;
          } else {
            const list = Array.isArray(cached) ? cached : (o.skills || []);
            skillHtml = list.length
              ? list.map((s) => `<span class="cap-sk">${esc(s.display_name || s.skill_key || s.name)}</span>`).join("")
              : `<span class="muted">（暂无技能）</span>`;
          }
        }
        return `
          <div class="cap-occ">
            <div class="cap-occ-h" data-cap-occ="${i}">
              <span class="cap-lv">L${o.level == null ? "-" : o.level}</span>
              <span class="cap-nm">${esc(o.display_name || o.name)}</span>
              <span class="muted">技能 ${cnt} ${open ? "▾" : "▸"}</span>
            </div>
            <div class="cap-sks" ${open ? "" : "hidden"}>${skillHtml}</div>
          </div>`;
      }).join("");

      box.innerHTML = `
        <div class="cap-root">
          专业：<b>${esc(root.display_name || root.name || state.capQ)}</b>
          <div class="muted">所属行业：${inds} · 对口岗位 ${meta.occupation_count || 0} · 技能合计 ${meta.skill_total || 0}
            ${meta.skills_included ? "" : "· 技能默认折叠，点岗位展开"}</div>
        </div>
        ${progHtml}
        ${sharedHtml}
        ${occs || `<div class="empty">该专业暂无对口岗位（prepares_for）</div>`}
      `;
      box.querySelectorAll("[data-cap-occ]").forEach((el) => {
        el.onclick = () => {
          const i = el.dataset.capOcc;
          state.capOpen[i] = !state.capOpen[i];
          const o = (state.capData.occupations || [])[i];
          if (state.capOpen[i] && o && !state.capSkills[o.id]) {
            loadOccSkills(o.id);
            return;
          }
          renderCapabilityBody();
        };
      });
    }

    /** 技能构成编辑页（专业 covers / 岗位 requires），交互对齐管理端原型：
     *  头部信息 + 每行 L1–L5 档位按钮 + 权重输入 + 底部搜索下拉添加 + 归一化 */
    async function openComposition(nodeId, opts) {
      // silent：添加/改档/改权重后的刷新不再重弹「加载中」，避免每次操作都闪一下
      const silent = !!(opts && opts.silent);
      if (!silent) openModal(`<h2>技能构成</h2><div class="empty">加载中…</div>`);
      let d;
      try {
        d = await api.apiFetch("/v1/admin/composition?node_id=" + encodeURIComponent(nodeId));
      } catch (e) {
        openModal(`<h2>技能构成</h2><div class="empty">加载失败：${esc(e.message || e)}</div>
          <div class="form-actions"><button class="btn" type="button" id="cpClose">关闭</button></div>`);
        $("cpClose").onclick = closeModal;
        return;
      }
      const h = d.node || {};
      const weighted = !!d.weighted;

      // 头部：所属行业 / 关联专业 / 职级 / 薪资 / 状态（原型构成页上方）
      const headRows = `<div class="kv-grid">` + [
        ["名称", esc(h.name || "—")],
        ["所属行业", esc(h.industry_name || "—")],
        h.type === "occupation" ? ["关联专业", esc(h.major_name || "—")] : null,
        h.type === "occupation" ? ["职级", esc(h.level_label || "—")] : null,
        h.type === "occupation" ? ["薪资", esc(h.salary || "—")] : null,
        ["状态", nodeStatusCell(h)],
        ["编码", `<code>${esc(h.code || "—")}</code>`],
        ["版本", esc(h.version_label || "V1")],
      ].filter(Boolean).map(([k, v]) => `<div class="kv"><b>${k}</b><span>${v}</span></div>`).join("") + `</div>`;

      const rows = (d.items || []).map((it) => {
        const avail = it.available_levels || [];
        // L1–L5 档位按钮：该技能没配齐的档禁用，选中档高亮
        const lvMap = {};
        (it.levels || []).forEach((x) => { if (x.level) lvMap[x.level] = x; });
        const btns = `<div class="lv-btns">` + [1, 2, 3, 4, 5].map((lv) => {
          const has = avail.includes(lv);
          const on = it.selected_level === lv;
          const info = lvMap[lv];
          // 档位要求写进 title：选档时 hover 就能看到这一档要求什么
          const labPart = info && info.level_label ? " " + info.level_label : "";
          const reqPart = info && info.requirement ? " — " + info.requirement : "";
          const tip = has ? `L${lv}${labPart}${reqPart}` : "该技能未配齐此档";
          return `<button class="btn ${on ? "primary" : ""}" type="button"
            ${has ? "" : "disabled"} title="${esc(tip)}"
            data-setlv="${esc(it.skill_key)}" data-lv="${lv}">L${lv}</button>`;
        }).join("") + `</div>`;
        // 选中档的要求，直接在行内展示一行，不必 hover
        const selInfo = lvMap[it.selected_level];
        const reqLine = selInfo && selInfo.requirement
          ? `<div class="muted" style="max-width:420px;white-space:normal;font-size:12px;margin-top:3px">
               L${selInfo.level}${selInfo.level_label ? " " + esc(selInfo.level_label) : ""} 要求：${esc(selInfo.requirement.slice(0, 120))}${selInfo.requirement.length > 120 ? "…" : ""}
             </div>`
          : "";
        const wCell = weighted
          ? `<input style="width:78px" type="number" step="0.01" min="0" max="1"
               value="${it.weight != null ? it.weight : ""}" data-w="${esc(it.skill_key)}" />`
          : `<span class="muted">—</span>`;
        return `<tr>
          <td>${esc(it.skill_key)}<div class="muted">${(it.prereqs || []).length
                ? "先修：" + (it.prereqs || []).map(esc).join("、")
                : "无先修"}</div></td>
          <td>${btns}${reqLine}</td>
          <td>${wCell}</td>
          <td><button class="btn danger" type="button" data-rmsk="${esc(it.skill_key)}">移除</button></td>
        </tr>`;
      }).join("");

      const wsumLine = weighted
        ? `<span class="muted">权重和 </span><b>${(d.weight_sum ?? 0).toFixed ? d.weight_sum.toFixed(2) : d.weight_sum}</b>
           ${d.normalized ? '<span class="tag pub">已归一</span>' : '<span class="tag">未归一</span>'}
           <button class="btn" type="button" id="cpNorm">归一化</button>`
        : `<span class="muted">专业技能不带权重，无需归一化</span>`;

      openModal(`
        <h2>技能构成 · ${esc(h.name || "")}</h2>
        ${headRows}
        <div class="form-row"><label>技能（${(d.items || []).length}）</label><div>${wsumLine}</div></div>
        <table class="data">
          <thead><tr><th>技能 / 先修</th><th>要求等级（点选）</th><th>权重</th><th>操作</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" class="empty">还没有技能，用下方搜索添加</td></tr>`}</tbody>
        </table>
        <div class="form-row"><label>添加技能</label>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <!-- 可输入即搜索的下拉：input + datalist，边打字边从服务端拉候选 -->
            <input id="cpSel" list="cpList" placeholder="输入技能名搜索并选择…"
                   style="min-width:280px" autocomplete="off" />
            <datalist id="cpList"></datalist>
            <!-- 档位选项随所选技能实时生成，不写死 L1–L5 -->
            <select id="cpLv" style="width:150px">
              <option value="">先选技能</option>
            </select>
            <button class="btn primary" type="button" id="cpAdd">添加</button>
            <span class="muted" id="cpHint"></span>
          </div>
        </div>
        <div class="form-row"><label>档位要求</label>
          <div id="cpLvDesc" class="muted" style="max-height:150px;overflow:auto">选择技能后显示各档要求</div>
        </div>
        <div class="form-actions"><button class="btn" type="button" id="cpClose">关闭</button></div>
      `, { wide: true });
      $("cpClose").onclick = closeModal;

      const reload = () => openComposition(nodeId, { silent: true });

      // 档位点选
      document.querySelectorAll("[data-setlv]").forEach((el) => {
        el.onclick = async () => {
          if (el.disabled) return;
          // 乐观高亮：同组按钮先切换选中态，网络失败再由刷新纠正
          const group = el.parentElement;
          if (group) group.querySelectorAll(".btn").forEach((b) => b.classList.remove("primary"));
          el.classList.add("primary");
          el.disabled = true;
          try {
            await api.apiFetch("/v1/admin/composition?node_id=" + encodeURIComponent(nodeId),
              { method: "PUT", body: { skill_key: el.dataset.setlv, level: Number(el.dataset.lv) } });
            toast("已设为 L" + el.dataset.lv);
            await reload();
          } catch (e) {
            toast(e.message || e, true);
            await reload();
          }
        };
      });
      // 权重改动（失焦提交）
      document.querySelectorAll("[data-w]").forEach((el) => {
        el.onchange = async () => {
          try {
            await api.apiFetch("/v1/admin/composition?node_id=" + encodeURIComponent(nodeId),
              { method: "PUT", body: { skill_key: el.dataset.w, weight: Number(el.value || 0) } });
            toast("权重已更新"); reload();
          } catch (e) { toast(e.message || e, true); }
        };
      });
      // 移除
      document.querySelectorAll("[data-rmsk]").forEach((el) => {
        el.onclick = async () => {
          try {
            await api.apiFetch("/v1/admin/composition?node_id=" + encodeURIComponent(nodeId)
              + "&skill_key=" + encodeURIComponent(el.dataset.rmsk), { method: "DELETE" });
            toast("已移除"); reload();
          } catch (e) { toast(e.message || e, true); }
        };
      });
      // 归一化
      if ($("cpNorm")) {
        $("cpNorm").onclick = async () => {
          try {
            const r = await api.apiFetch(
              "/v1/admin/composition/normalize?node_id=" + encodeURIComponent(nodeId), { method: "POST" });
            toast(`已归一：${r.normalized_from} → ${r.weight_sum}`); reload();
          } catch (e) { toast(e.message || e, true); }
        };
      }
      // 技能搜索 → 填充下拉
      let cpTimer = null;
      let cpOpts = [];
      const doSearch = async () => {
        const q = $("cpSel").value.trim();
        try {
          cpOpts = await api.apiFetch(
            "/v1/admin/composition/options?limit=50" + (q ? "&q=" + encodeURIComponent(q) : ""));
          // datalist 的 option 只能放纯值，档位信息放 label 里提示
          $("cpList").innerHTML = cpOpts.map((x) =>
            `<option value="${esc(x.skill_key)}" label="${esc(x.level_completeness)} ${esc(x.category || "")}"></option>`).join("");
          $("cpHint").textContent = cpOpts.length ? `${cpOpts.length} 个匹配` : "无匹配";
        } catch (e) { toast(e.message || e, true); }
      };
      // 所选技能变化 → 按该技能实际配齐的档位重建等级下拉，
      // 避免选到未配齐的档、点了添加才被后端 400 拦住
      const syncLevels = () => {
        const key = $("cpSel").value.trim();
        const hit = cpOpts.find((x) => x.skill_key === key);
        const sel = $("cpLv");
        // 重建 options 会把 value 冲回第一项，而本函数也挂在 cpSel 的 change 上：
        // 点「添加」时输入框失焦 → change → 重建 → 用户刚选的档被静默换成默认最高档。
        // 故先记住已选档，重建后按值还原。
        const keep = sel.value;
        if (!hit) {
          sel.innerHTML = `<option value="">先选技能</option>`;
          return;
        }
        // available_levels 已是 int 1–5，无需再从 "L3" 里抠数字
        const lvs = (hit.available_levels || []).map(Number).filter(Boolean).sort();
        const lmap = {};
        (hit.levels || []).forEach((x) => { if (x.level) lmap[x.level] = x; });
        sel.innerHTML = `<option value="">默认最高档（L${lvs[lvs.length - 1] ?? "?"}）</option>`
          + lvs.map((n) => {
              const info = lmap[n] || {};
              const lab = info.level_label ? " " + info.level_label : "";
              return `<option value="${n}">L${n}${lab}</option>`;
            }).join("");
        if (keep && [...sel.options].some((o) => o.value === keep)) sel.value = keep;
        $("cpHint").textContent = `已配齐 ${hit.level_completeness}`;
        // 各档要求展开在下方，选之前就能看清差异
        const box = $("cpLvDesc");
        if (box) {
          box.innerHTML = lvs.length
            ? lvs.map((n) => {
                const x = lmap[n] || {};
                return `<div style="font-size:12px;margin:3px 0">
                  <b>L${n}</b>${x.level_label ? `<span class="muted">（${esc(x.level_label)}）</span>` : ""}
                  <span class="muted">${esc((x.requirement || "无要求说明").slice(0, 140))}</span></div>`;
              }).join("")
            : "";
        }
      };
      $("cpSel").oninput = () => {
        clearTimeout(cpTimer);
        syncLevels();                                  // 选中候选项时立即刷新档位
        cpTimer = setTimeout(async () => { await doSearch(); syncLevels(); }, 260);
      };
      $("cpSel").onchange = syncLevels;
      doSearch();
      $("cpAdd").onclick = async () => {
        const key = $("cpSel").value.trim();
        if (!key) { toast("请先输入并选择技能", true); return; }
        // 一个技能只保留一个要求档：本地先挡一次，避免白跑一趟网络
        const dup = (d.items || []).find((it) => it.skill_key === key);
        if (dup) {
          toast(`「${key}」已在构成中（当前 L${dup.selected_level || "?"}），`
            + "请直接点该行的档位按钮调整", true);
          return;
        }
        const lv = $("cpLv").value;
        try {
          // mode=add：后端也判重，防绕过前端直接调接口
          await api.apiFetch(
            "/v1/admin/composition?mode=add&node_id=" + encodeURIComponent(nodeId),
            { method: "PUT", body: { skill_key: key, level: lv ? Number(lv) : null } });
          toast("已添加 " + key); reload();
        } catch (e) {
          // 409 判重的提示语已由 api-client 从 detail.message 提取到 e.message
          toast(e.message || e, true);
        }
      };
    }

    /** 四维详情弹层：字段对齐 backend.html 原型，取数走 /v1/kg/node-detail */
    async function openNodeDetail(nodeId) {
      openModal(`<h2>详情</h2><div class="empty">加载中…</div>`);
      let d;
      try {
        d = await api.apiFetch("/v1/kg/node-detail?id=" + encodeURIComponent(nodeId));
      } catch (e) {
        openModal(`<h2>详情</h2><div class="empty">加载失败：${esc(e.message || e)}</div>
          <div class="form-actions"><button class="btn" type="button" id="dtClose">关闭</button></div>`);
        $("dtClose").onclick = closeModal;
        return;
      }
      const n = d.node || {};
      const kv = (k, v) => `<div class="form-row"><label>${esc(k)}</label><div>${v}</div></div>`;
      let body = "";
      body += kv("编码", `<code>${esc(n.code || "—")}</code>`);
      body += kv("状态", nodeStatusCell(n));
      if (n.version_label) body += kv("版本", esc(n.version_label));
      if (n.owner_name) body += kv("负责人", esc(n.owner_name));
      if (n.description) body += kv("简介", `<div class="muted">${esc(String(n.description).slice(0, 400))}</div>`);

      if (n.type === "industry") {
        body += `<h3>关联专业（${(d.majors || []).length}）</h3>` + ((d.majors || []).length
          ? `<table class="data"><tr><th>专业</th><th>状态</th><th>岗位数</th></tr>` +
            d.majors.slice(0, 50).map((m) =>
              `<tr><td>${esc(m.name)}</td><td>${esc(m.status || "")}</td><td>${m.occupation_count}</td></tr>`).join("") +
            `</table>` : `<div class="muted">无</div>`);
        body += `<h3>直连岗位（${(d.occupations || []).length}）</h3>` +
          ((d.occupations || []).map((o) => `<span class="cap-sk">${esc(o.name)}</span>`).join("") || `<div class="muted">无</div>`);
      } else if (n.type === "major") {
        body += kv("所属行业", (d.industries || []).map((i) => esc(i.name)).join("、") || "—");
        body += `<h3>关联岗位（${(d.occupations || []).length}）</h3>` + ((d.occupations || []).length
          ? `<table class="data"><tr><th>岗位</th><th>状态</th><th>层级</th><th>技能项</th><th>权重和</th></tr>` +
            d.occupations.map((o) =>
              `<tr><td>${esc(o.name)}</td><td>${esc(o.status || "")}</td>
                   <td>${o.level != null ? "L" + o.level : "—"}</td>
                   <td>${o.skill_count}</td><td>${weightSumCell(o.weight_sum)}</td></tr>`).join("") +
            `</table>` : `<div class="muted">无</div>`);
        // 需求变更：专业详情不再展示「聚合技能」（那是经岗位间接汇总的），
        // 改为直连技能构成，在专用编辑页管理
        const dsk = d.skills || [];
        body += `<h3>技能构成（${dsk.length}）<span class="muted"> · 专业直连技能</span></h3>`;
        body += dsk.length
          ? dsk.map((sk) => `<span class="cap-sk">${esc(sk.skill_key)}${sk.selected_level ? " L" + sk.selected_level : ""}</span>`).join("")
          : `<div class="muted">还没有直连技能</div>`;
      } else if (n.type === "occupation") {
        body += kv("所属行业", (d.industries || []).map((i) => esc(i.name)).join("、") || "—");
        body += kv("关联专业", (d.majors || []).map((i) => esc(i.name)).join("、") || "—");
        body += kv("层级", n.level != null ? "L" + n.level : "—");
        body += `<h3>技能构成（${(d.skills || []).length}）<span class="muted"> · 权重和 ${d.weight_sum}</span></h3>`;
        body += (d.skills || []).length
          ? `<table class="data"><tr><th>技能</th><th>要求等级</th><th>权重</th><th>类别</th><th>先修</th><th>L1–L5</th></tr>` +
            d.skills.map((sk) =>
              `<tr><td>${esc(sk.skill_key)}${sk.is_core ? ' <span class="tag">核心</span>' : ""}</td>
                   <td>L${sk.required_level ?? "-"}</td>
                   <td>${sk.weight_pct != null ? sk.weight_pct + "%" : "—"}</td>
                   <td class="muted">${esc(sk.category || "未分类")}</td>
                   <td class="muted">${(sk.prereqs || []).length ? esc(sk.prereqs.join("、")) : "无先修"}</td>
                   <td>${(sk.levels || []).map((g) => g.required ? "■" : (g.exists ? "□" : "·")).join("")}</td>
               </tr>`).join("") + `</table>`
          : `<div class="muted">无</div>`;
      } else if (n.type === "skill_level") {
        body += kv("技能 key", esc(d.skill_key || ""));
        body += kv("分类", esc(d.category || "未分类"));
        body += kv("等级完整度", esc(d.level_completeness || "—") + " " +
          (d.levels || []).map((g) => g.exists ? "■" : "·").join(""));
        body += kv("先修", (d.prereqs || []).map((x) => esc(x.prereq_skill_key)).join("、") || "无");
        body += kv("解锁", (d.unlocks || []).map((x) => esc(x.skill_key)).join("、") || "无");
        body += `<h3>引用岗位（${(d.occupations || []).length}）</h3>` +
          ((d.occupations || []).map((o) => `<span class="cap-sk">${esc(o.name)}</span>`).join("") || `<div class="muted">无</div>`);
      }

      openModal(`<h2>${esc(TYPE_ZH[n.type] || "")}详情 · ${esc(n.display_name || n.name || "")}</h2>
        ${body}
        <div class="form-actions">
          ${(n.type === "major" || n.type === "occupation")
            ? `<button class="btn primary" type="button" id="dtComp">技能构成</button>` : ""}
          <button class="btn" type="button" id="dtEdit">编辑</button>
          <button class="btn" type="button" id="dtClose">关闭</button>
        </div>`, { wide: true });
      if ($("dtComp")) $("dtComp").onclick = () => openComposition(nodeId);
      $("dtClose").onclick = closeModal;
      $("dtEdit").onclick = async () => {
        try {
          const full = await api.apiFetch("/v1/node?id=" + encodeURIComponent(nodeId) + "&scope=manage");
          openNodeForm(full, true);
        } catch (e) { toast(e.message || e, true); }
      };
    }

    /** 权重和：国标权重应配满 1.00，偏离则标色提示 */
    function weightSumCell(w) {
      const v = Number(w || 0);
      if (!v) return `<span class="muted">—</span>`;
      const ok = v >= 0.85 && v <= 1.15;
      return `<span style="color:${ok ? "#16a34a" : "#f59e0b"}" title="${ok ? "接近 1.00" : "偏离 1.00，建议核对各档权重"}">${v.toFixed(2)}</span>`;
    }

    /** 业务编码单元格：code 已提到顶层，attrs.code 仅作兼容回落 */
    function codeCellHtml(n) {
      const code = n.code || (n.attrs && n.attrs.code) || "";
      if (!code) return `<span class="muted">—</span>`;
      const pc = n.attrs && n.attrs.platform_code;
      // 行业编码已重建为语义 slug，原平台码存 attrs.platform_code，hover 可查
      return `<code title="${pc ? "原平台码 " + esc(pc) : ""}">${esc(code)}</code>`;
    }

    /** 关联数展示文案（按维度） */
    function countsCellHtml(n, type) {
      const c = countsOf(n);
      const parts = [];
      if (type === "industry") {
        parts.push(`专业 ${c.major ?? 0}`);
        parts.push(`岗位 ${c.occupation ?? 0}`);
      } else if (type === "major") {
        parts.push(`岗位 ${c.occupation ?? 0}`);
        parts.push(`技能 ${c.skill ?? 0}`);
      } else if (type === "occupation") {
        parts.push(`技能 ${c.skill ?? 0}`);
        if (c.major != null) parts.push(`专业 ${c.major}`);
        if (c.industry != null) parts.push(`行业 ${c.industry}`);
      } else if (type === "skill_level" || type === "skill_bundle") {
        parts.push(`岗位 ${c.occupation ?? 0}`);
        if (c.level != null) parts.push(`档位 ${c.level}`);
      }
      if (!parts.length) return `<span class="muted">—</span>`;
      return parts.map((p) => `<span class="tag">${p}</span>`).join(" ");
    }

    function levelsCellHtml(n) {
      // available_levels 是 int 1–5（越大越强）；L 前缀只是展示文案
      const av = n.available_levels || (n.attrs && n.attrs.available_levels) || [];
      return [1, 2, 3, 4, 5]
        .map((lv) => `<span class="tag ${av.includes(lv) ? "pub" : ""}">L${lv}</span>`)
        .join(" ");
    }

    /** 岗位所属行业（直连 + 经专业）；多行业用顿号 */
    function industryCellHtml(n) {
      const inds = Array.isArray(n.industries) ? n.industries : [];
      if (inds.length) {
        const names = inds.map((x) => x && (x.name || x.id)).filter(Boolean);
        if (!names.length) return `<span class="muted">—</span>`;
        const show = names.slice(0, 3).map((s) => esc(s)).join("、");
        const more = names.length > 3 ? ` <span class="muted">+${names.length - 3}</span>` : "";
        const tip = names.join("、");
        return `<span title="${esc(tip)}">${show}${more}</span>`;
      }
      const one = n.industry_name || n.industry_id;
      return one ? esc(one) : `<span class="muted">—</span>`;
    }

    async function loadList() {
      state.listMode = "nodes";
      // 技能库：管理端聚合（含 draft，真实 status）
      if (state.listType === "skill_level") {
        const params = new URLSearchParams({
          page: String(state.page),
          page_size: String(state.pageSize),
          region: "CN",
        });
        if (state.q) params.set("q", state.q);
        if (state.statusFilter) params.set("status", state.statusFilter);
        const data = await api.apiFetch("/v1/admin/skills?" + params);
        state.listMode = "skill_bundle";
        state.items = (data.items || []).map((b) => ({
          ...b,
          type: "skill_bundle",
          display_name: b.name || b.skill_name || b.skill_key,
          name: b.name || b.skill_name || b.skill_key,
          source_system: b.source_system || "aggregated",
          confidence: b.confidence || "—",
          // 不兜底：状态由接口给（status=线上聚合，record_status=含草稿）
          status: b.status,
          record_status: b.record_status,
          has_draft: b.has_draft,
          draft_change: b.draft_change,
        }));
        state.total = data.total || 0;
        state.totalPages = data.total_pages || 0;
        return;
      }
      const params = new URLSearchParams({
        type: state.listType,
        page: String(state.page),
        page_size: String(state.pageSize),
        region: "CN",
        scope: "manage",
        include_counts: "1",
        order_by: "created_desc",   // 新建的排最前，否则 sort_order 为空会被甩到末页
      });
      if (state.q) params.set("q", state.q);
      if (state.statusFilter) params.set("status", state.statusFilter);
      const data = await api.apiFetch("/v1/kg/nodes?" + params);
      state.items = data.items || [];
      state.total = data.total || 0;
      state.totalPages = data.total_pages || 0;
    }

    async function viewDimList(main) {
      const dim = DIMS.find((d) => d.nav === state.view) || DIMS[1];
      state.listType = dim.type;
      await loadList();
      const isSkillBundle = state.listMode === "skill_bundle";
      const rows = state.items.map((n) => {
        const name = n.display_name || n.name || "—";
        const idShow = isSkillBundle ? (n.skill_key || n.id) : n.id;
        if (isSkillBundle) {
          const st = recordStatusOf(n);
          // 原型技能库列：技能 / 分类 / 状态 / 版本 / 负责人 / 等级完整度
          return `<tr>
            <td class="name-cell">${esc(name)}<div class="id-cell">${esc(idShow)}</div></td>
            <td class="muted">${esc(n.category || "未分类")}</td>
            <td>${nodeStatusCell(n)}</td>
            <td>${esc(n.version_label || "—")}</td>
            <td class="muted">${esc(n.owner_name || n.updated_by_name || "—")}</td>
            <td>${esc(n.level_completeness || "—")} ${levelsCellHtml(n)}</td>
            <td class="row-actions">
              <button class="btn" type="button" data-edit="${esc(n.skill_key || n.name || "")}" title="编辑逻辑技能">编辑</button>
              <button class="btn" type="button" data-expand-skill="${esc(n.skill_key || n.name || "")}">档位明细</button>
              ${st === "published"
                ? `<button class="btn" type="button" data-dis-skill="${esc(n.skill_key || n.name || "")}">停用</button>`
                : `<button class="btn ok" type="button" data-en-skill="${esc(n.skill_key || n.name || "")}">发布</button>`}
            </td>
          </tr>`;
        }
        // 专业与岗位都有技能构成：岗位=requires(带权重)，专业=covers(直连、无权重)
        const extraBtn = (dim.type === "occupation" || dim.type === "major")
          ? `<button class="btn" type="button" data-comp="${esc(n.id)}">技能构成</button>`
          : "";
        const isOcc = dim.type === "occupation";
        const c = n.counts || {};
        // 按原型逐类型出列：行业=关联专业/关联岗位，专业=版本/岗位数/基础技能，
        // 岗位=所属行业/层级/技能项/权重和
        const mid = dim.type === "industry"
          ? `<td>${c.major ?? 0}</td><td>${c.occupation ?? 0}</td>`
          : dim.type === "major"
            ? `<td>${esc(n.version_label || "—")}</td><td>${c.occupation ?? 0}</td><td>${c.skill ?? 0}</td>`
            : isOcc
              ? `<td class="name-cell">${industryCellHtml(n)}</td>
                 <td>${n.level != null ? "L" + n.level : '<span class="muted">—</span>'}</td>
                 <td>${nodeStatusCell(n)}</td>
                 <td>${c.skill ?? 0}</td>
                 <td>${weightSumCell(c.weight_sum)}</td>`
              : `<td>${countsCellHtml(n, dim.type)}</td>
                 <td class="muted">${esc(n.source_system || "—")}</td>
                 <td class="muted">${esc(n.confidence || "—")}</td>`;
        return `<tr>
          <td class="name-cell">${esc(name)}<div class="id-cell">${esc(n.id)}</div></td>
          <td>${codeCellHtml(n)}</td>
          ${isOcc ? "" : `<td>${nodeStatusCell(n)}</td>`}
          ${mid}
          <td class="row-actions">
            ${n.pending_action
              ? `<span class="muted">审核中 #${esc(n.pending_change_id)}</span>`
              : `<button class="btn" type="button" data-detail="${esc(n.id)}">详情</button>${extraBtn}<button class="btn" type="button" data-edit="${esc(n.id)}">编辑</button>
            ${needsPublish(n)
              ? `<button class="btn ok" type="button" data-en="${esc(n.id)}">发布</button>`
              : `<button class="btn" type="button" data-dis="${esc(n.id)}">停用</button>`}
            <button class="btn danger" type="button" data-del="${esc(n.id)}">删除</button>`}
          </td>
        </tr>`;
      }).join("");
      const isOccList = !isSkillBundle && dim.type === "occupation";
      // 表头按 backend.html 原型逐类型对齐（见 docs/管理台详情接口-原型对照.md）
      const head = isSkillBundle
        ? `<tr><th>技能</th><th>分类</th><th>状态</th><th>版本</th><th>负责人</th><th>等级完整度</th><th>操作</th></tr>`
        : dim.type === "industry"
          ? `<tr><th>行业名称</th><th>编码</th><th>状态</th><th>关联专业</th><th>关联岗位</th><th>操作</th></tr>`
          : dim.type === "major"
            ? `<tr><th>专业</th><th>编码</th><th>状态</th><th>版本</th><th>岗位数</th><th>基础技能</th><th>操作</th></tr>`
            : isOccList
              ? `<tr><th>岗位</th><th>编码</th><th>所属行业</th><th>层级</th><th>状态</th><th>技能项</th><th>权重和</th><th>操作</th></tr>`
              : `<tr><th>名称 / ID</th><th>编码</th><th>状态</th><th>关联数</th><th>来源</th><th>置信度</th><th>操作</th></tr>`;
      const skillNote = isSkillBundle
        ? " · 按 skill_key 聚合 · 状态为各档聚合"
        : isOccList
          ? " · 所属行业=直连 belongs_to + 经专业两跳"
          : " · 关联数为联读统计";
      const statusSel = STATUS_FILTER_OPTS.map(
        (o) => `<option value="${esc(o.v)}" ${state.statusFilter === o.v ? "selected" : ""}>${esc(o.lab)}</option>`
      ).join("");
      main.innerHTML = `
        <div class="page-h">
          <div>
            <h1>${esc(dim.label)}</h1>
            <p>可查看/筛选全部状态 · ${reviewOn() ? "写操作进审核" : "写操作直接生效（无审核）"} · 共 ${state.total} 条${skillNote}</p>
          </div>
          <button class="btn primary" type="button" id="btnNewNode">新建${esc(TYPE_ZH[dim.type] || "")}</button>
        </div>
        <div class="toolbar">
          <input type="search" id="q" placeholder="名称检索…" value="${esc(state.q)}" />
          <select id="stFilter" title="按状态筛选">${statusSel}</select>
          <button class="btn" type="button" id="btnSearch">搜索</button>
          <button class="btn" type="button" id="btnReload">刷新</button>
        </div>
        <div class="panel">
          ${state.items.length ? `
          <table class="data">
            <thead>${head}</thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="pager">
            第 ${state.page} / ${Math.max(state.totalPages, 1)} 页 · 每页 ${state.pageSize}
            <button class="btn" type="button" data-pg="-1" ${state.page <= 1 ? "disabled" : ""}>上一页</button>
            <button class="btn" type="button" data-pg="1" ${state.page >= state.totalPages ? "disabled" : ""}>下一页</button>
          </div>` : `<div class="empty">暂无数据</div>`}
        </div>
      `;
      $("btnSearch").onclick = () => {
        state.q = $("q").value.trim();
        state.statusFilter = ($("stFilter") && $("stFilter").value) || "";
        state.page = 1;
        render();
      };
      $("q").onkeydown = (e) => { if (e.key === "Enter") $("btnSearch").click(); };
      if ($("stFilter")) {
        $("stFilter").onchange = () => {
          state.statusFilter = $("stFilter").value || "";
          state.page = 1;
          render();
        };
      }
      $("btnReload").onclick = () => render();
      $("btnNewNode").onclick = () => openNodeForm({ type: dim.type, status: "draft" });
      main.querySelectorAll("[data-pg]").forEach((b) => {
        b.onclick = () => {
          state.page = Math.max(1, state.page + Number(b.dataset.pg));
          render();
        };
      });
      main.querySelectorAll("[data-expand-skill]").forEach((b) => {
        b.onclick = async () => {
          const key = b.dataset.expandSkill;
          try {
            const detail = await api.apiFetch(
              "/v1/admin/skills/" + encodeURIComponent(key) + "?region=CN"
            );
            const levels = detail.levels || [];
            const body = levels.length
              ? `<table class="data"><thead><tr><th>等级</th><th>状态</th><th>节点 ID</th><th>描述</th><th></th></tr></thead><tbody>${
                  levels.map((lv) => `<tr>
                    <td><span class="tag pub">${lv.level ? "L" + lv.level : "L?"}</span> ${esc(lv.level_label || "")}</td>
                    <td>${statusTag(lv.status || detail.record_status || detail.status)}</td>
                    <td class="id-cell">${esc(lv.node_id || "—")}</td>
                    <td class="muted">${esc((lv.description || "").slice(0, 80))}</td>
                    <td>${lv.node_id ? `<button class="btn" type="button" data-edit-lv="${esc(lv.node_id)}">编辑</button>` : ""}</td>
                  </tr>`).join("")
                }</tbody></table>`
              : `<div class="empty">暂无分档节点</div>`;
            const prereqs = detail.prerequisites || [];
            const preHtml = prereqs.length
              ? `<p class="muted">先修：${prereqs.map((p) => esc(p.skill_key || p.name)).join("、")}</p>`
              : `<p class="muted">先修：无</p>`;
            openModal(`
              <h2>技能档位 · ${esc(detail.name || key)} ${statusTag(recordStatusOf(detail))}</h2>
              <p class="muted">关联岗位 ${detail.counts?.occupation ?? 0} · 已有 ${(detail.available_levels || []).map((v) => "L" + v).join(" / ") || "—"}</p>
              ${preHtml}
              ${body}
              <div class="form-actions">
                <button class="btn" type="button" id="btnEditBundle">编辑多档/先修</button>
                <button class="btn" type="button" id="btnCloseLv">关闭</button>
              </div>
            `);
            $("btnCloseLv").onclick = closeModal;
            $("btnEditBundle").onclick = () => openSkillBundleForm({ skill_key: key, name: detail.name || key, _edit: true, _detail: detail });
            $("modal").querySelectorAll("[data-edit-lv]").forEach((btn) => {
              btn.onclick = async () => {
                try {
                  const n = await api.apiFetch(
                    "/v1/node?id=" + encodeURIComponent(btn.dataset.editLv) + "&scope=manage"
                  );
                  openNodeForm(n, true);
                } catch (e) { toast(e.message, true); }
              };
            });
          } catch (e) { toast(e.message || e, true); }
        };
      });
      main.querySelectorAll("[data-comp]").forEach((b) => {
        b.onclick = () => openComposition(b.dataset.comp);
      });
      main.querySelectorAll("[data-detail]").forEach((b) => {
        b.onclick = () => openNodeDetail(b.dataset.detail);
      });
      main.querySelectorAll("[data-edit]").forEach((b) => {
        b.onclick = async () => {
          try {
            // 推荐 query：id 含冒号时 path 编码易触发 UC MAC 失败
            const nid = b.dataset.edit;
            if (isSkillBundle) {
              openSkillBundleForm({ skill_key: b.dataset.edit, _edit: true });
              return;
            }
            const n = await api.apiFetch(
              "/v1/node?id=" + encodeURIComponent(nid) + "&scope=manage"
            );
            openNodeForm(n, true);
          } catch (e) { toast(e.message, true); }
        };
      });
      main.querySelectorAll("[data-del]").forEach((b) => {
        b.onclick = async () => {
          if (!confirm(actMsg(
            "确认删除？将立即物理删除节点及其关联边（不删其它节点）。",
            "删除将提交审核，通过后物理删除节点及其关联边。继续？"
          ))) return;
          try {
            await api.apiFetch("/v1/admin/changes", {

    /** 门禁/冲突的失败原因转人话。
     *
     * 发布失败最常见的是 BR 门禁（`gate_failed`）与并发（`stale_draft`），
     * 后端把结构化理由放在 `detail.violations` / `detail.message` 里。
     * 只 toast 一句「400」的话运营看不出是哪条规则、缺什么，只能来问人。
     */
    function publishFailReason(e) {
      // api-client 把响应体挂在 err.data 上（不是 body），别拿错字段
      const d = (e && e.data && e.data.detail) || (e && e.detail) || null;
      if (d && typeof d === "object") {
        if (Array.isArray(d.violations) && d.violations.length) {
          return d.violations.map((v) => `${v.rule}：${v.message}`).join("；");
        }
        if (Array.isArray(d.missing) && d.missing.length) {
          return `${d.message || "端点未发布"}（${d.missing.join("、")}）`;
        }
        if (d.message) return d.message;
      }
      return (e && e.message) || String(e);
    }

          </div>
          <div>
            <button class="btn ok" type="button" id="btnPubAll" ${items.length ? "" : "disabled"}>全部发布</button>

            <tbody>${rows}</tbody>
          </table>` : `<div class="empty">没有待发布的改动。在四维列表编辑内容、或改技能构成后会出现在这里。</div>`}
        </div>
      `;
      $("btnDraftReload").onclick = () => { state.draftMsg = null; render(); };
      main.querySelectorAll("[data-pub]").forEach((b) => {
        b.onclick = async () => {
          b.disabled = true;
          try {
            const r = await api.apiFetch(
              "/v1/admin/publish/node?node_id=" + encodeURIComponent(b.dataset.pub),
              { method: "POST", body: {} });
            state.draftMsg =
              `<div class="panel">已发布 ${esc(b.dataset.pub)} → ${esc(r.status)}`

    }

    function multiSelectHtml(id, items, selectedIds) {
      const sel = new Set(selectedIds || []);
      if (!items.length) return `<div class="muted" id="${id}">暂无可选项</div>`;
      return `<select id="${id}" multiple size="8" style="width:100%;min-height:120px">
        ${items.map((it) => {
          const lab = it.display_name || it.name || it.id;
          return `<option value="${esc(it.id)}" ${sel.has(it.id) ? "selected" : ""}>${esc(lab)}</option>`;
        }).join("")}
      </select>
      <div class="muted">按住 Ctrl/⌘ 多选</div>`;
    }

    function selectedValues(selId) {
      const el = document.getElementById(selId);
      if (!el || !el.options) return [];
      return [...el.selectedOptions].map((o) => o.value);
    }

    const LEVEL_META = [
      { code: "L1", label: "了解" },
      { code: "L2", label: "掌握" },
      { code: "L3", label: "熟练" },
      { code: "L4", label: "精通" },
      { code: "L5", label: "专家" },
    ];

    /** 新建/编辑逻辑技能：L1–L5 + 岗位权重 + 先修 → admin/skills */
    async function openSkillBundleForm(seed) {
      seed = seed || {};
      const isEdit = !!seed._edit;
      openModal(`<h2>${isEdit ? "编辑" : "新建"}技能（多档）</h2><div class="empty">加载…</div>`);
      let peers = [];
      let detail = seed._detail || null;
      try {
        peers = await loadLinkOptions("occupation");
      } catch (e) {
        toast("加载岗位失败: " + (e.message || e), true);
      }
      if (isEdit && seed.skill_key && !detail) {
        try {
          detail = await api.apiFetch("/v1/admin/skills/" + encodeURIComponent(seed.skill_key));
        } catch (_) { /* 无则空表 */ }
      }
      const descByLv = {};
      const labelByLv = {};
      (detail?.levels || []).forEach((lv) => {
        // 档位以 int level 为准；这里的 "L3" 只是 LEVEL_META 的行 key
        const code = lv.level ? "L" + lv.level : "";
        if (code) {
          descByLv[code] = lv.description || "";
          labelByLv[code] = lv.level_label || "";
        }
      });
      Object.assign(descByLv, detail?.level_descriptions || {});
      const levelRows = LEVEL_META.map((lv) => `
        <div class="form-row" style="border-left:3px solid #bfdbfe;padding-left:10px;margin-bottom:10px">
          <label><span class="tag pub">${lv.code}</span> ${lv.label}</label>
          <input id="lv_label_${lv.code}" placeholder="档位名（默认 ${lv.label}）" value="${esc(labelByLv[lv.code] || lv.label)}" style="margin-bottom:6px" />
          <textarea id="lv_desc_${lv.code}" placeholder="能力等级描述（可空则不建该档）" rows="2">${esc(descByLv[lv.code] || "")}</textarea>
        </div>
      `).join("");
      const occOpts = peers.map((it) => {
        const lab = it.display_name || it.name || it.id;
        return `<option value="${esc(it.id)}">${esc(lab)}</option>`;
      }).join("");
      const preList = (detail?.prerequisites || []).map((p) => p.skill_key || p.name).filter(Boolean);
      openModal(`
        <h2>${isEdit ? "编辑" : "新建"}技能 · L1–L5</h2>
        <p class="muted">审核通过后拆成多条 skill_level；岗位<strong>权重写在 requires 边</strong>（非技能节点）。</p>
        <div class="form-row"><label>技能名 skill_key *</label>
          <input id="f_skill_key" value="${esc(seed.skill_key || seed.name || detail?.skill_key || "")}" placeholder="如：流量承接" ${isEdit ? "readonly" : ""} />
        </div>
        <div class="form-row"><label>能力等级 levels.L* = {}</label>
          ${levelRows}
        </div>
        <div class="form-row"><label>先修技能（BR-05，逗号分隔 skill_key）</label>
          <input id="f_prereq" value="${esc(preList.join(", "))}" placeholder="如：精准投放, 内容脚本" />
        </div>
        <div class="form-row"><label>关联岗位（技能构成 · 边权重）</label>
          <div style="display:grid;gap:8px">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <select id="f_occ_pick" style="flex:1;min-width:180px">${occOpts || "<option value=\"\">暂无岗位</option>"}</select>
              <input id="f_occ_w" type="number" min="0" max="100" step="1" placeholder="权重%" value="20" style="width:88px" title="百分制，服务端转 0–1" />
              <select id="f_occ_req" style="width:100px" title="要求档">
                ${LEVEL_META.map((lv) => `<option value="${lv.code.slice(1)}">${lv.code}</option>`).join("")}
              </select>
              <button class="btn" type="button" id="btnAddOcc">添加</button>
            </div>
            <div id="occLinkList" class="muted">尚未添加岗位</div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" type="button" id="f_cancel">取消</button>
          <button class="btn" type="button" id="f_preview">预览拆分</button>
          <button class="btn primary" type="button" id="f_save">${saveBtnLabel()}</button>
        </div>
      `);
      const occLinks = [];
      function renderOccLinks() {
        const box = $("occLinkList");
        if (!occLinks.length) {
          box.innerHTML = `<span class="muted">尚未添加岗位</span>`;
          return;
        }
        box.innerHTML = `<table class="data"><thead><tr><th>岗位</th><th>权重%</th><th>要求档</th><th></th></tr></thead><tbody>${
          occLinks.map((x, i) => {
            const p = peers.find((t) => t.id === x.occupation_id);
            const lab = p ? (p.display_name || p.name) : x.occupation_id;
            return `<tr>
              <td>${esc(lab)}<div class="id-cell">${esc(x.occupation_id)}</div></td>
              <td>${x.weight_pct != null ? x.weight_pct : "—"}</td>
              <td>L${x.required_level || "—"}</td>
              <td><button class="btn danger" type="button" data-rm="${i}">移除</button></td>
            </tr>`;
          }).join("")
        }</tbody></table>`;
        box.querySelectorAll("[data-rm]").forEach((b) => {
          b.onclick = () => {
            occLinks.splice(Number(b.dataset.rm), 1);
            renderOccLinks();
          };
        });
      }
      $("btnAddOcc").onclick = () => {
        const oid = $("f_occ_pick").value;
        if (!oid) return;
        if (occLinks.some((x) => x.occupation_id === oid)) {
          toast("该岗位已添加", true);
          return;
        }
        const wp = Number($("f_occ_w").value);
        const rl = Number($("f_occ_req").value) || 3;
        occLinks.push({
          occupation_id: oid,
          weight_pct: Number.isFinite(wp) ? wp : null,
          required_level: rl,
        });
        renderOccLinks();
      };
      $("f_cancel").onclick = closeModal;

      function buildBody() {
        const skill_key = $("f_skill_key").value.trim();
        const levels = {};
        LEVEL_META.forEach((lv) => {
          const desc = ($("lv_desc_" + lv.code).value || "").trim();
          const label = ($("lv_label_" + lv.code).value || "").trim() || lv.label;
          if (desc) {
            levels[lv.code] = { label, description: desc };
          }
        });
        const occupation_links = occLinks.map((x) => ({
          occupation_id: x.occupation_id,
          weight: x.weight_pct != null ? x.weight_pct / 100 : null,
          required_level: x.required_level,
        }));
        return { skill_key, name: skill_key, levels, occupation_links, region: "CN" };
      }

      $("f_preview").onclick = async () => {
        try {
          const body = buildBody();
          if (!body.skill_key) { toast("请填写技能名", true); return; }
          if (!Object.keys(body.levels).length) { toast("至少填写一档描述", true); return; }
          const p = await api.apiFetch("/v1/admin/skills/preview", { method: "POST", body });
          toast(`将建 ${p.will_create_nodes} 个节点 · ${p.will_create_edges} 条 requires 边`);
        } catch (e) { toast(e.message || e, true); }
      };

      $("f_save").onclick = async () => {
        try {
          const body = buildBody();
          if (!body.skill_key) { toast("请填写技能名", true); return; }
          if (!Object.keys(body.levels).length) { toast("至少填写一档描述", true); return; }
          if (isEdit) {
            await api.apiFetch("/v1/admin/skills/" + encodeURIComponent(body.skill_key), {
              method: "PATCH",
              body,
            });
          } else {
            await api.apiFetch("/v1/admin/skills", { method: "POST", body });
          }
          // 先修：审核外即时写（无环校验）
          const preRaw = ($("f_prereq").value || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean);
          try {
            await api.apiFetch(
              "/v1/admin/skills/" + encodeURIComponent(body.skill_key) + "/prerequisites",
              { method: "PUT", body: { prereq_skill_keys: preRaw, region: "CN" } }
            );
          } catch (pe) {
            toast("多档已提交；先修写入失败: " + (pe.message || pe), true);
          }
          toast(isEdit
            ? actMsg("技能已更新", "技能更新已提交审核")
            : actMsg("技能已保存（多档已拆分）", "技能多档已提交审核；通过后拆成 N 条节点"));
          closeModal();
          state.view = "skill";
          state.page = 1;
          render();
        } catch (e) { toast(e.message || e, true); }
      };
    }

    async function openNodeForm(n, isEdit) {
      n = n || {};
      const types = ["industry", "major", "occupation", "skill_level"];
      const ntype = n.type || "major";
      // 新建技能：走多档 bundle 表单
      if (!isEdit && ntype === "skill_level") {
        return openSkillBundleForm(n);
      }
      openModal(`<h2>${isEdit ? "编辑节点" : "新建节点"}</h2><div class="empty">加载关联选项…</div>`);
      let linkBlock = "";
      let peerType = null;
      let linkKey = null;
      let linkLabel = "";
      if (ntype === "major" || (!isEdit && true)) {
        // 根据类型决定关联
      }
      const typeNow = isEdit ? ntype : ntype;
      if (typeNow === "major") {
        peerType = "industry"; linkKey = "industry_ids"; linkLabel = "所属行业（可多选）";
      } else if (typeNow === "occupation") {
        peerType = "major"; linkKey = "major_ids"; linkLabel = "对口专业（可多选）";
      } else if (typeNow === "skill_level") {
        peerType = "occupation"; linkKey = "occupation_ids"; linkLabel = "关联岗位（可多选）";
      }
      let peers = [];
      try {
        if (peerType) peers = await loadLinkOptions(peerType);
      } catch (e) {
        toast("加载关联列表失败: " + (e.message || e), true);
      }
      const preselected = n[linkKey] || (n.link_ids && n.link_ids[linkKey]) || [];
      openModal(`
        <h2>${isEdit ? "编辑节点" : "新建节点"}</h2>
        <div class="form-row"><label>类型</label>
          <select id="f_type" ${isEdit ? "disabled" : ""}>
            ${types.map((t) => `<option value="${t}" ${(n.type || "major") === t ? "selected" : ""}>${TYPE_ZH[t]}</option>`).join("")}
          </select>
        </div>
        <div class="form-row"><label>名称 *</label><input id="f_name" value="${esc(n.name || "")}" /></div>
        <div class="form-row"><label>编码</label>
          <input id="f_code" value="${esc(n.code || (n.attrs && n.attrs.code) || "")}"
                 placeholder="同类型内唯一，如 internet-ecom / 580506K" />
        </div>
        <div class="form-row"><label>负责人</label>
          <input id="f_owner" value="${esc(n.owner_name || "")}" placeholder="留空则取当前登录人" />
        </div>
        <div class="form-row"><label>区域</label><input id="f_region" value="${esc(n.region || "CN")}" /></div>
        <div class="form-row"><label>简介</label><textarea id="f_desc">${esc(n.description || "")}</textarea></div>
        <div class="form-row" id="linkRow" ${peerType ? "" : "style=\"display:none\""}>
          <label id="linkLab">${esc(linkLabel || "关联")}</label>
          <div id="linkBox">${peerType ? multiSelectHtml("f_links", peers, preselected) : ""}</div>
        </div>
        <p class="muted">关联由服务端自动建边（专业↔行业 / 岗位↔专业 / 技能↔岗位）。${
          reviewOn() ? "提交后进<strong>待审</strong>。" : "当前<strong>无审核</strong>，保存即生效。"
        }</p>
        <div class="form-actions">
          <button class="btn" type="button" id="f_cancel">取消</button>
          <button class="btn primary" type="button" id="f_save">${saveBtnLabel()}</button>
        </div>
      `);
      $("f_cancel").onclick = closeModal;

      async function refreshLinkForType(t) {
        if (!isEdit && t === "skill_level") {
          closeModal();
          openSkillBundleForm({});
          return;
        }
        const row = $("linkRow");
        const lab = $("linkLab");
        const box = $("linkBox");
        let pt = null, key = null, label = "";
        if (t === "major") { pt = "industry"; key = "industry_ids"; label = "所属行业（可多选）"; }
        else if (t === "occupation") { pt = "major"; key = "major_ids"; label = "对口专业（可多选）"; }
        else if (t === "skill_level") { pt = "occupation"; key = "occupation_ids"; label = "关联岗位（可多选）"; }
        row.dataset.linkKey = key || "";
        if (!pt) { row.style.display = "none"; box.innerHTML = ""; return; }
        row.style.display = "";
        lab.textContent = label;
        box.innerHTML = `<div class="muted">加载中…</div>`;
        try {
          const items = await loadLinkOptions(pt);
          box.innerHTML = multiSelectHtml("f_links", items, []);
        } catch (e) {
          box.innerHTML = `<div class="muted">加载失败</div>`;
        }
      }
      // 新建/编辑都必须带上 linkKey，否则多选关联不会写入 payload
      $("linkRow").dataset.linkKey = linkKey || "";
      if (!isEdit) {
        $("f_type").onchange = () => refreshLinkForType($("f_type").value);
      }

      $("f_save").onclick = async () => {
        const payload = {
          type: $("f_type").value,
          name: $("f_name").value.trim(),
          region: $("f_region").value.trim() || "CN",
          description: $("f_desc").value.trim() || null,
        };
        // 编码：写进 attrs.code（服务端以此做同 region+type 唯一性校验）。
        // 合并原有 attrs，避免编辑时把 parent_name/platform_code 等字段覆盖丢失。
        const ownerVal = ($("f_owner") && $("f_owner").value.trim()) || "";
        if (ownerVal) payload.owner_name = ownerVal;
        const codeVal = ($("f_code") && $("f_code").value.trim()) || "";
        const baseAttrs = (n && n.attrs && typeof n.attrs === "object") ? { ...n.attrs } : {};
        if (codeVal) baseAttrs.code = codeVal;
        else delete baseAttrs.code;
        if (Object.keys(baseAttrs).length) payload.attrs = baseAttrs;
        const lk = $("linkRow").dataset.linkKey
          || ($("f_type").value === "major" ? "industry_ids"
            : $("f_type").value === "occupation" ? "major_ids"
            : $("f_type").value === "skill_level" ? "occupation_ids" : "");
        if (lk) {
          const ids = selectedValues("f_links");
          if (ids.length) payload[lk] = ids;
          else if (isEdit) payload[lk] = []; // 编辑时空选表示清空关联
        }
        if (!payload.name) { toast("请填写名称", true); return; }
        try {
          if (isEdit && n.id) {
            payload.id = n.id;
            await api.apiFetch("/v1/admin/changes", {
              method: "POST",
              body: {
                entity_kind: "node",
                action: "update",
                dim_type: n.type || payload.type,
                target_id: n.id,
                payload,
              },
            });
            toast(actMsg("已保存", "编辑已提交审核"));
          } else {
            await api.apiFetch("/v1/admin/changes", {
              method: "POST",
              body: {
                entity_kind: "node",
                action: "create",
                dim_type: payload.type,
                payload,
              },
            });
            const linkHint = (payload.industry_ids || payload.major_ids || payload.occupation_ids)
              ? "（含关联）"
              : "";
            toast(actMsg(
              "已新建" + linkHint + "（默认草稿，发布须过门禁）",
              "新建已提交审核" + linkHint + "；通过前不会出现在已发布列表"
            ));
          }
          closeModal();
          // 留在当前维度列表（新建通过前列表可能仍无该行；编辑/删会显示待审）
          if (DIMS.some((d) => d.type === payload.type)) {
            state.view = DIMS.find((d) => d.type === payload.type).nav;
            state.listType = payload.type;
          }
          render();
        } catch (e) {
          // 编码冲突 409：提示占用者并聚焦编码框，而非丢一句通用报错
          const d = e && e.data && e.data.detail;
          if (e && e.status === 409 && d && d.error === "code_conflict") {
            toast(d.message || "编码已被占用", true);
            const el = $("f_code");
            if (el) { el.focus(); el.select(); el.style.borderColor = "#ef4444"; }
            return;
          }
          toast(e.message || e, true);
        }
      };
    }

    function openEdgeForm() {
      openModal(`
        <h2>新建关系边</h2>
        <div class="form-row"><label>起点 src_id *</label><input id="e_src" placeholder="CN:major:…" /></div>
        <div class="form-row"><label>终点 dst_id *</label><input id="e_dst" placeholder="CN:occupation:…" /></div>
        <div class="form-row"><label>关系类型 *</label>
          <select id="e_rel">
            ${["prepares_for","requires","belongs_to","parent_of","related_to","taught_by"].map((r) =>
              `<option value="${r}">${r}</option>`).join("")}
          </select>
        </div>
        <div class="grid2">
          <div class="form-row"><label>权重 0–1</label><input id="e_w" type="number" step="0.1" min="0" max="1" value="0.8" /></div>
          <div class="form-row"><label>状态</label>
            <select id="e_st"><option value="draft">draft</option><option value="published">published</option></select>
          </div>
        </div>
        <div class="form-row"><label>证据</label><textarea id="e_ev"></textarea></div>
        <div class="form-actions">
          <button class="btn" type="button" id="f_cancel">取消</button>
          <button class="btn primary" type="button" id="f_save">保存</button>
        </div>
      `);
      $("f_cancel").onclick = closeModal;
      $("f_save").onclick = async () => {
        const body = {
          src_id: $("e_src").value.trim(),
          dst_id: $("e_dst").value.trim(),
          rel_type: $("e_rel").value,
          weight: Number($("e_w").value) || null,
          status: $("e_st").value,
          evidence: $("e_ev").value.trim() || null,
          region: "CN",
        };
        if (!body.src_id || !body.dst_id) { toast("请填写 src/dst", true); return; }
        try {
          await api.apiFetch("/v1/admin/changes", {
            method: "POST",
            body: { entity_kind: "edge", action: "create", payload: body },
          });
          toast(actMsg("边已创建", "边已提交审核（留在本页）"));
          closeModal();
          render();
        } catch (e) { toast(e.message || e, true); }
      };
    }

    function openProposalForm() {
      openModal(`
        <h2>提交待审变更（JSON）</h2>
        <div class="form-row"><label>entity_kind</label>
          <select id="p_kind"><option value="node">node</option><option value="edge">edge</option></select>
        </div>
        <div class="form-row"><label>action</label>
          <select id="p_act">
            <option value="create">create</option>
            <option value="update">update</option>
            <option value="delete">delete</option>
            <option value="disable">disable</option>
            <option value="enable">enable</option>
          </select>
        </div>
        <div class="form-row"><label>payload JSON</label>
          <textarea id="p_payload" style="min-height:140px">{
  "type": "occupation",
  "name": "待审岗位",
  "region": "CN"
}</textarea>
        </div>
        <div class="form-actions">
          <button class="btn" type="button" id="f_cancel">取消</button>
          <button class="btn primary" type="button" id="f_save">提交</button>
        </div>
      `);
      $("f_cancel").onclick = closeModal;
      $("f_save").onclick = async () => {
        let payload;
        try { payload = JSON.parse($("p_payload").value); }
        catch (_) { toast("payload 不是合法 JSON", true); return; }
        try {
          const r = await api.apiFetch("/v1/admin/changes", {
            method: "POST",
            body: {
              entity_kind: $("p_kind").value,
              action: $("p_act").value,
              dim_type: payload.type || null,
              target_id: payload.id || null,
              payload,
            },
          });
          toast(r && r.direct
            ? actMsg("已直写生效", "已生效")
            : ("已提交 #" + (r && r.id) + "（可稍后到审核发布处理）"));
          closeModal();
          render();
        } catch (e) { toast(e.message || e, true); }
      };
    }

    /* ---------- boot ---------- */
    (async function () {
      const ok = await bootAuth();
      if (ok) render();
    })();
  </script>
</body>
</html>
